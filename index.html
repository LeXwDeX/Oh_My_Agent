canvas.addEventListener("pointerdown", e => {
  canvas.setPointerCapture(e.pointerId); const q = loc(e); ptrs.set(e.pointerId, q);
  if (ptrs.size === 1){ dragG = ground(...q); S.down = {x: q[0], y: q[1], moved: false} }
  if (ptrs.size === 2){ const [a, b] = [...ptrs.values()]; pinch = {d: Math.hypot(a[0] - b[0], a[1] - b[1]), m: [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2]}; dragG = null }
});
canvas.addEventListener("pointermove", e => {
  if (!ptrs.has(e.pointerId)){ hoverAt(e); return }
  const q = loc(e); ptrs.set(e.pointerId, q);
  if (S.down && !S.down.moved){
    if (ptrs.size === 1 && Math.hypot(q[0] - S.down.x, q[1] - S.down.y) <= 5) return;
    S.down.moved = true; canvas.classList.add("drag"); hideTip(); S.tween = null;
  }
  if (ptrs.size === 2 && pinch){
    const [a, b] = [...ptrs.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]), m = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
    const g0 = ground(...pinch.m); zoomBy(d / pinch.d, m[0], m[1]); const g1 = ground(...m);
    cam.tx += g0[0] - g1[0]; cam.ty += g0[1] - g1[1]; pinch = {d, m};
  } else if (dragG){ const g = ground(...q); cam.tx += dragG[0] - g[0]; cam.ty += dragG[1] - g[1] }
  S.autoFit = false;
});
const endPtr = e => {
  if (e.type === "pointerup" && ptrs.size === 1 && S.down && !S.down.moved){
    const p = pickPerson(...loc(e));
    if (p){ S.hover = p.key; showTip(p, e.clientX, e.clientY); if (onPersonClick) onPersonClick(p) } else { S.hover = null; hideTip() }
  }
  if (ptrs.size <= 1) S.down = null;
  ptrs.delete(e.pointerId); if (ptrs.size < 2) pinch = null;
  if (!ptrs.size){ dragG = null; canvas.classList.remove("drag") } else if (ptrs.size === 1){ const [p] = [...ptrs.values()]; dragG = ground(...p) }
};
canvas.addEventListener("pointerup", endPtr); canvas.addEventListener("pointercancel", endPtr);
canvas.addEventListener("pointerleave", () => { if (!ptrs.size){ S.hover = null; hideTip(); canvas.classList.remove("pick") } });
function zoomBy(f, sx, sy){
  S.tween = null;
  const g0 = ground(sx, sy); cam.zoom = clamp(cam.zoom * f, 4, 90); const g1 = ground(sx, sy);
  cam.tx += g0[0] - g1[0]; cam.ty += g0[1] - g1[1]; S.autoFit = false;
}
// 普通滚轮不缩放（留给网页上下滚动）；只接管触控板双指捏合（浏览器以 ctrlKey + wheel 上报），否则会缩放整页
canvas.addEventListener("wheel", e => { if (!e.ctrlKey) return; e.preventDefault(); zoomBy(Math.exp(-e.deltaY * .01), ...loc(e)) }, {passive: false});
$("zin").onclick = () => zoomBy(1.25, viewCx(), cssH / 2);
$("zout").onclick = () => zoomBy(.8, viewCx(), cssH / 2);
$("zfit").onclick = () => { S.autoFit = true; S.tween = null; fit() };
$("lay").innerHTML = Object.entries(LAYOUTS).map(([k, v]) => `<option value="${k}"${k === S.layout ? " selected" : ""}>🏢 ${v.name}</option>`).join("");
$("lay").onchange = e => { S.layout = e.target.value; try { localStorage.setItem("office.layout", S.layout) } catch {} $("replay").onclick() };
$("replay").onclick = () => sceneReplay();
$("timebar").addEventListener("click", e => {
  const b = e.target.closest("button[data-h]"); if (!b) return;
  S.hourMode = b.dataset.h; for (const x of $("timebar").querySelectorAll("button")) x.classList.toggle("on", x === b);
});
$("labels").addEventListener("click", e => {
  const el = e.target.closest(".zl.vis"); if (!el) return;
  const Z = S.zoneEls.find(([x]) => x === el)?.[1]; if (!Z) return;
  S.tween = {a: {...cam}, b: camTarget(Z.cx, Z.cy, .6, Math.max(cam.zoom, 64), .05), t0: performance.now(), dur: 650}; S.autoFit = false;
});
const officeRO = new ResizeObserver(() => resize()); officeRO.observe($("office"));
var SCENE_OK = true;                                         // 页面层据此判断体素场景可用
</script>
<script>
/* 项目名显示：全大写，连续下划线并成一个空格（只影响显示，分组键仍用原名） */
function projLabel(n){ return String(n).replace(/_+/g, " ").trim().toUpperCase() || String(n); }
/* 原泳道看板（顶部统计 / 档位 / 排班泳道 / 日志 / 跑马灯），包成模块以免与体素场景的全局名冲突 */
const Deck = (() => {
const $ = id => document.getElementById(id);
const SRC_COLOR = {app:"var(--app)", cli:"var(--cli)", ds:"var(--ds)", qwen:"var(--qwen)"};
const SRC_HEX = {app:"#e08a5f", cli:"#b8b3a8", ds:"#5b9dff", qwen:"#a884ff"};
const JOB_PALETTE = ["#ff9a3c","#5b9dff","#6fcf8a","#a884ff","#e8c46a","#4fd1c5","#ff7aa8","#9ccc65","#f0a35e","#7aa2ff"];
const KIND_LABEL = {on:"ON DUTY", finished:"FINISHED", done:"DONE", stopped:"STOPPED", failed:"FAILED"};
const ST_LABEL = {working:"WORKING", idle:"IDLE", finished:IC.check+" FINISHED", done:IC.check+" DONE", stopped:IC.stop+" STOPPED", failed:IC.close+" FAILED"};
/* 齿轮：外沿正好贴满 16×16 视框，徽标里左/上/下与文字间距都等于 3px */
const GEAR=`<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="3" stroke-dasharray="2.553 2.553"/><circle cx="8" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="3.2"/></svg>`;
const VERB = {on:"上岗", finished:"完成", done:"收工", stopped:"中止", failed:"失败"};

const S = {pinReply:null, data:null, ok:true, win:+(localGet("win")||1), job:null, off:new Set(JSON.parse(localGet("off")||"[]")), open:new Set(), showAll:new Set(), skew:0};
function localGet(k){try{return localStorage.getItem("deck."+k)}catch{return null}}
function localSet(k,v){try{localStorage.setItem("deck."+k,v)}catch{}}

function srcBase(id){return String(id||"").split("@")[0]}
function sCol(id){return SRC_COLOR[srcBase(id)]||"#9a958c"}
function sHex(id){return sCol(id)}   /* 用 CSS 变量，白天 / 夜晚各自取色 */
/* ---------- 增量更新：把新 HTML 与现有 DOM 对比，只改有变化的文字/属性，元素尽量复用
   （图片不重新加载、动画不中断）；带 data-key 的元素按 key 匹配，新出现的条目淡入。 */
function patch(el, html){
  const tpl=document.createElement("template"); tpl.innerHTML=html;
  morphChildren(el, tpl.content, el.hasChildNodes());
}
function sameKind(a,b){
  if(a.nodeType!==b.nodeType||a.nodeName!==b.nodeName) return false;
  return a.nodeType!==1 || (a.getAttribute("data-key")===b.getAttribute("data-key"));
}
function morphChildren(oldP, newP, animate){
  const keyed=new Map();
  for(const c of oldP.childNodes) if(c.nodeType===1&&c.hasAttribute("data-key")) keyed.set(c.getAttribute("data-key"),c);
  let ref=oldP.firstChild;
  for(const n of [...newP.childNodes]){
    let m=null;
    const k=n.nodeType===1?n.getAttribute("data-key"):null;
    if(k!==null){ m=keyed.get(k)||null; if(m&&m.nodeName!==n.nodeName) m=null; if(m) keyed.delete(k); }
    else if(ref&&sameKind(ref,n)) m=ref;
    if(m){ if(m===ref) ref=ref.nextSibling; else oldP.insertBefore(m, ref); morph(m,n,animate); }
    else { oldP.insertBefore(n, ref); if(animate&&k!==null) n.classList.add("enter"); }
  }
  while(ref){ const nx=ref.nextSibling; oldP.removeChild(ref); ref=nx; }
}
function morph(a,b,animate){
  if(a.nodeType===3||a.nodeType===8){ if(a.nodeValue!==b.nodeValue) a.nodeValue=b.nodeValue; return; }
  for(const at of [...a.attributes]) if(!b.hasAttribute(at.name)) a.removeAttribute(at.name);
  for(const at of b.attributes) if(a.getAttribute(at.name)!==at.value) a.setAttribute(at.name, at.value);
  morphChildren(a,b,animate);
}

function h(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function hash(s){let x=2166136261;for(const c of String(s)){x^=c.charCodeAt(0);x=Math.imul(x,16777619)}return x>>>0}
function darken(c){return "#"+[1,3,5].map(i=>Math.round(parseInt(c.slice(i,i+2),16)*.68).toString(16).padStart(2,"0")).join("")}
function jobColor(j){if(j==="lead")return "var(--text)";const c=JOB_PALETTE[hash(j)%JOB_PALETTE.length];return document.documentElement.dataset.theme==="light"?darken(c):c}
function now(){return Date.now()+S.skew}
function dur(ms){ms=Math.max(0,ms);const s=Math.round(ms/1000);if(s<60)return s+"s";const m=Math.floor(s/60);if(m<60)return m+"m "+String(s%60).padStart(2,"0")+"s";return Math.floor(m/60)+"h "+String(m%60).padStart(2,"0")+"m"}
function ago(t){const s=Math.round((now()-t)/1000);if(s<60)return s+"s 前";const m=Math.round(s/60);if(m<120)return m+"m 前";return Math.round(m/60)+"h 前"}
function hm(t,sec){const d=new Date(t);const p=n=>String(n).padStart(2,"0");return p(d.getHours())+":"+p(d.getMinutes())+(sec?":"+p(d.getSeconds()):"")}
function shortModel(m){return m?m.replace(/^claude-/,"").replace(/-(\d+)-(\d+)$/,"-$1.$2"):""}

/* 像素头像：按 id 生成 8x8 左右对称小人，颜色由哈希决定 */
const AV_CACHE = new Map();
function avatar(id, kind, name){
  if(name && S.data && S.data.avatars && S.data.avatars.includes(name.toLowerCase())) return `<span class="avi"><img src="/avatars/${name.toLowerCase()}.png" alt="" decoding="sync"></span>`;
  const key=id+kind; if(AV_CACHE.has(key)) return AV_CACHE.get(key);
  let r=hash(id); const rnd=()=>{r^=r<<13;r^=r>>>17;r^=r<<5;return (r>>>0)/4294967296};
  const hue=Math.floor(rnd()*360), hue2=(hue+140+Math.floor(rnd()*80))%360;
  const skin=["#f1c9a5","#d9a17a","#b77b52","#8a5a3b","#f5dcc4"][Math.floor(rnd()*5)];
  const hair=`hsl(${hue2} 55% ${28+rnd()*25}%)`, shirt=`hsl(${hue} 65% 58%)`, bg=`hsl(${hue} 30% 16%)`;
  const grid=[];
  // 行 0-2 头发/头部，3-4 脸，5-7 身体
  for(let y=0;y<8;y++){grid.push([]);for(let x=0;x<4;x++){
    let c=null;
    if(kind==="lead"){ // 主会话：头盔/天线造型
      if(y===0) c = x===3? hair : null;
      else if(y===1) c = x>=1? hair: null;
      else if(y<=4) c = x===0? null : (y===3&&x===2? "#111" : (y===2&&x===1? hair : skin));
      else c = x===0&&y===5? null : shirt;
    } else {
      const longHair=rnd()>.5;
      if(y===0) c = x>=1 && rnd()>.25 ? hair : null;
      else if(y===1) c = x>=1? hair: (longHair?hair:null);
      else if(y<=4) c = x===0? (longHair&&y<4?hair:null) : (y===3&&x===2? "#111" : (y===4&&x===3&&rnd()>.5? "#c0564b": skin));
      else c = x===0&&y===5? null : (y===7&&x===3? `hsl(${hue} 60% 42%)` : shirt);
    }
    grid[y].push(c);
  }}
  let rects=`<rect width="8" height="8" fill="${bg}"/>`;
  for(let y=0;y<8;y++)for(let x=0;x<4;x++){const c=grid[y][x];if(c){rects+=`<rect x="${x}" y="${y}" width="1" height="1" fill="${c}"/><rect x="${7-x}" y="${y}" width="1" height="1" fill="${c}"/>`}}
  const svg=`<svg viewBox="0 0 8 8" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">${rects}</svg>`;
  AV_CACHE.set(key,svg); return svg;
}

/* 排序吸附：进行中的会话首次出现时定下位置，之后不因“最后活动时间”变化而跳动；
   新出现的排在最上面。已结束的按结束时间排（不再变化）。子 agent 按开始时间、最新在上。 */
const RANK=new Map(); let rankSeq=0;
function visibleLeads(){
  const d=S.data; if(!d) return [];
  const first=RANK.size===0;
  d.leads.forEach((l,i)=>{ const k=l.src+"|"+l.id; if(!RANK.has(k)) RANK.set(k, first? i : --rankSeq); });
  const isLive=l=>l.status==="working"||l.status==="idle";
  return d.leads.filter(l=>!S.off.has(l.src)).map(l=>{
    const agents = (S.job ? l.agents.filter(a=>a.type===S.job) : l.agents).slice().sort((a,b)=>b.start-a.start);
    return {...l, agents};
  }).filter(l=>!S.job || l.agents.length || S.job==="lead")
    .sort((a,b)=> isLive(a)!==isLive(b) ? (isLive(a)?-1:1)
      : isLive(a) ? RANK.get(a.src+"|"+a.id)-RANK.get(b.src+"|"+b.id) : b.last-a.last);
}

function renderStats(){
  const d=S.data, leads=d.leads.filter(l=>!S.off.has(l.src));
  const all=leads.flatMap(l=>l.agents.map(a=>({...a,lead:l})));
  const working=[...leads.filter(l=>l.status==="working").map(l=>l.name), ...all.filter(a=>a.status==="working").map(a=>a.name)];
  const fin=all.filter(a=>a.status==="finished").sort((a,b)=>b.last-a.last);
  const bad=all.filter(a=>a.status==="failed"||a.status==="stopped");
  const online=leads.filter(l=>l.status==="working"||l.status==="idle");
  const nf=bad.filter(a=>a.status==="failed").length, ns=bad.length-nf;
  const stat=(k,v,vc,sub,extra="")=>`<div class="stat"><div class="k">${k}</div><div class="row2"><div class="v" style="color:${vc}">${v}</div><div class="col">${extra}<div class="sub">${sub}</div></div></div></div>`;
  patch($("stats"),
    stat(`<b style="background:var(--work);border-radius:50%"></b>WORKING`, working.length, working.length?"var(--work)":"var(--text)",
      h(working.length? working.slice(0,2).join(", ")+(working.length>2?` +${working.length-2}`:"") : "都在待命"))+
    stat(`<b style="background:var(--done)"></b>FINISHED`, fin.length, "var(--text)", fin[0]?`最近 ${h(fin[0].name)} · ${ago(fin[0].last)}`:"—")+
    stat(`<b style="border:1.5px solid var(--stop)"></b>STOPPED · FAILED`, bad.length, nf?"var(--fail)":bad.length?"var(--text)":"var(--faint)", bad.length?`失败 ${nf} · 中止 ${ns}`:"一切正常")+
    stat(`ONLINE`, online.length, "var(--text)", `共 ${leads.length} 会话 · 近 ${Number(d.hours)||12}h`, `<div class="bar"><i style="width:${leads.length?online.length/leads.length*100:0}%"></i></div>`));
}

function renderSources(){
  if(!$("sources")) return;   /* 主页面不显示档位筛选栏（数字已在顶部） */
  patch($("sources"),`<span class="lab">SOURCES</span>`+S.data.sources.filter(s=>s.sessions||srcBase(s.id)!=="cli").map(s=>`
    <button class="src ${S.off.has(s.id)?"off":""}" data-src="${h(s.id)}" title="${h(s.dir)} · 点击显示/隐藏">
      <span class="dot" style="background:${sCol(s.id)}"></span>
      <span class="nm">${h(s.label)}</span>
      <span class="meta">${s.working?`<em>${s.working} 工作</em> · `:""}${s.online}/${s.sessions} 在线${s.agents?` · ${s.agents} 子`:""}</span>
    </button>`).join(""));
}

function renderJobs(){
  const counts=Object.create(null);
  for(const l of S.data.leads) if(!S.off.has(l.src)) for(const a of l.agents) counts[a.type]=(counts[a.type]||0)+1;
  const keys=Object.keys(counts).sort((a,b)=>counts[b]-counts[a]);
  patch($("jobs"),keys.map(k=>`<button class="chip has ${S.job===k?"sel":""}" style="--c:${jobColor(k)}" data-job="${h(k)}">${h(k)}<span class="n">${counts[k]}</span></button>`).join("")
    || `<span class="chip">暂无子 agent</span>`);
}

function axisRange(){const t=now(); return [t-S.win*3600e3, t]}
function pct(t){const [a,b]=axisRange();return Math.max(0,Math.min(100,(t-a)/(b-a)*100))}

function renderAxis(){
  const [a,b]=axisRange(); const px=($("axis").clientWidth||300)*0.84;
  const maxTicks=Math.max(1,Math.floor(px/52)), mins=S.win*60;
  const step=[5,10,15,30,60,120,180,240,360].find(m=>mins/m<=maxTicks)||720;
  const first=Math.ceil(a/(step*60e3))*step*60e3; let out="";
  for(let t=first;t<b-(b-a)*0.16;t+=step*60e3) out+=`<span style="left:${pct(t)}%">${hm(t)}</span>`;
  out+=`<span class="now" style="left:auto;right:0;transform:none">NOW ${IC.caretD}</span>`;
  patch($("axis"),out);
  patch($("win"),[1,3,6,12].map(w=>`<button class="${S.win===w?"on":""}" data-win="${w}">${w}h</button>`).join(""));
}

function bar(item, isLead){
  const end = (item.status==="working"||item.status==="idle") ? now() : item.last;
  const L=pct(item.start), R=pct(end); const c = isLead ? sHex(item.src) : jobColor(item.type);
  let s=`<div class="nowl" style="left:100%"></div>`;
  if(end>=axisRange()[0]) s+=`<div class="seg-b ${isLead?"ghost":""}" style="--c:${c};left:${L}%;width:${Math.max(R-L,0.4)}%"></div>`;
  if(item.status==="working") s+=`<div class="orb" style="left:100%"></div>`;
  return `<div class="tl">${s}</div>`;
}

/* 工具名显示：去掉 mcp 前缀，连续下划线换成一个空格并全部转大写（mcp__Claude_Browser__computer → CLAUDE BROWSER COMPUTER） */
function toolName(t){ return (String(t).replace(/^mcp(?=_)/i,"").replace(/_+/g," ").trim() || String(t)).toUpperCase(); }
function replyLine(item){
  // 工具只显示名字（仅在工作中显示，结束后的工具名已过时）；回复只显示文字
  const tool = item.status==="working" && item.tool ? `<span class="tool">${GEAR}${h(toolName(item.tool))}</span>` : "";
  if(!item.reply && !tool) return "";
  const k=item.id||"";
  return `<div class="l3 ${S.pinReply===k?"open":""}" data-reply="${h(k)}">${tool}<span class="rt">${h(item.reply||"")}</span></div>`;
}
function stLabel(st){st=ST_LABEL[st]?st:"stopped";return `<span class="st ${st}">${st==="working"?'<span class="spin" aria-hidden="true"></span> ':""}${ST_LABEL[st]}</span>`}

function leadRow(l, live, hasKids){
  const n=l.agents.length, w=l.agents.filter(a=>a.status==="working").length;
  const fin=l.agents.filter(a=>a.status==="finished").length, stp=n-w-fin;
  const isW=l.status==="working";
  return `<div class="row lead ${isW?"isw":""} ${hasKids?"kids":""}" data-lead="${h(l.src+"|"+l.id)}" title="点击切换到这间办公室">
    <div class="who">
      <div class="av">${avatar(l.id,"lead",l.face||l.name)}<span class="sb" style="background:${sCol(l.src)}"></span></div>
      <div class="txt">
        <div class="l1"><span class="n" style="color:${sHex(l.src)}">${h(l.name)}</span><span class="mdl">${h(shortModel(l.model))}</span>${stLabel(l.status)}</div>
        <div class="l2"><span class="task" title="${h(l.title)}">${h(projLabel(l.project || ""))} · ${h(l.title)}</span></div>
        ${replyLine(l)}
      </div>
    </div>
    ${bar(l,true)}
    <div class="wk"><div class="d">${dur((isW||l.status==="idle"?now():l.last)-l.start)}</div><div class="s">${n? (w?`<span style="color:var(--work)">${w}</span>/${n} 工作`:`${n} agent${n>1?"s":""}`) :"无子 agent"}</div></div>
  </div>`;
}

function childRow(a, mid){
  return `<div class="row child ${mid?"mid":""} ${a.status==="working"?"isw":""}" data-key="a:${h(a.id)}">
    <div class="who">
      <div class="av">${avatar(a.id,"agent",a.name)}</div>
      <div class="txt">
        <div class="l1"><span class="n">${h(a.name)}</span><span class="job" style="color:${jobColor(a.type)}">${h(a.type)}</span><span class="mdl">${h(shortModel(a.model))}${a.bg?" · bg":""}</span></div>
        <div class="l2">${stLabel(a.status)}<span class="task" title="${h(a.task||"")}">${h(a.task||"—")}</span></div>
        ${replyLine(a)}
      </div>
    </div>
    ${bar(a,false)}
    <div class="wk"><div class="d">${dur((a.status==="working"?now():a.last)-a.start)}</div><div class="s">${a.status==="working"?"在岗":ago(a.last)}</div></div>
  </div>`;
}

function leadBlock(l, live){
  const LIMIT = live ? 8 : 3;
  const all=S.showAll.has(l.id); const kids = all? l.agents : l.agents.slice(0, LIMIT);
  let s=leadRow(l, live, kids.length>0);
  kids.forEach((a,i)=>{ s+=childRow(a, i<kids.length-1) });
  const rest=l.agents.length-kids.length;
  if(rest>0){const fin=l.agents.slice(kids.length).filter(a=>a.status==="finished").length;
    s+=`<div class="more">+ ${rest} more · ${fin} 完成 · ${rest-fin} 其他 · <button data-all="${h(l.id)}">${IC.caretD} 全部展开</button></div>`}
  else if(all && l.agents.length>LIMIT) s+=`<div class="more"><button data-all="${h(l.id)}">${IC.caretU} 收起</button></div>`;
  const hot = l.status==="working" || l.agents.some(a=>a.status==="working");
  return `<div class="blk ${hot?"w":""} ${API.isSel(l.src,l.id)?"sel":""}" style="--sc:${sHex(l.src)}" data-key="l:${h(l.src)}:${h(l.id)}">${s}</div>`;
}

function renderLanes(){
  const leads=visibleLeads();
  const live=leads.filter(l=>l.status==="working"||l.status==="idle");
  const recent=leads.filter(l=>!(l.status==="working"||l.status==="idle"));
  const liveAgents=live.reduce((n,l)=>n+l.agents.filter(a=>a.status==="working").length,0);
  let html="";
  html+=`<div class="group lv"><div class="gh"><span>LIVE · ${live.length} 会话 · ${liveAgents} 子 agent 在岗</span><span>用时</span></div>
    ${live.length? live.map(l=>leadBlock(l,true)).join("") : `<div class="empty">当前没有在线会话</div>`}</div>`;
  html+=`<div class="group"><div class="gh"><span>RECENT · ${recent.length} 会话</span><span>用时</span></div>
    ${recent.length? recent.map(l=>leadBlock(l,false)).join("") : `<div class="empty">近 ${Number(S.data.hours)||12}h 没有已结束的会话</div>`}</div>`;
  patch($("lanes"),html);
}

function evLine(e){
  const who = e.job==="lead" ? `<b style="color:${sHex(e.src)}">${h(e.who)}</b> <span class="dim">${h(e.task||"")}</span>`
    : `<b style="color:${jobColor(e.job)}">${h(e.who)}</b> <span class="dim">${h(e.job)}</span> <span class="faint">@${h(e.lead)}</span>`;
  return who;
}
function renderLog(){
  const ev=S.data.events.filter(e=>!S.off.has(e.src) && (!S.job||e.job===S.job));
  $("logn").textContent=`${ev.length} 条 · 最新在前`;
  patch($("log"),ev.slice(0,250).map(e=>`<div class="ev ${now()-e.at<120e3?"hl":""} ${API.isSel(e.src,e.lid)?"cur":""}" data-key="${h(e.src+"|"+e.lid+"|"+(e.aid||"")+"|"+e.kind+"|"+e.at)}"><span class="t">${hm(e.at,true)}</span><span class="k ${KIND_LABEL[e.kind]?e.kind:""}">${h(KIND_LABEL[e.kind]||e.kind)}</span><span class="w" title="${h(e.task||"")}">${evLine(e)}</span></div>`).join("")
    || `<div class="empty">暂无事件</div>`);
  const tk=ev.slice(0,14).map(e=>`<span class="tk"><span class="t">${hm(e.at,true)}</span><b style="color:${e.job==="lead"?sHex(e.src):jobColor(e.job)}">${h(e.who)}</b> ${h(VERB[e.kind]||e.kind)} · <span class="dim">${h(e.job==="lead"?"会话":e.job)}</span></span>`).join("");
  // 鼠标悬停时冻结跑马灯内容；只有事件真的变了才更新，避免停住时内容跳动
  const tkKey=ev.slice(0,14).map(e=>e.src+e.lid+(e.aid||"")+e.kind+e.at).join("|");
  if(!document.querySelector(".ticker").matches(":hover") && tkKey!==S.tkKey){
    S.tkKey=tkKey;
    patch($("ticker"), tk ? tk + tk : `<span class="dim">等待事件…</span>`);
    restartTicker($("ticker"));
  }
}
/* translateX(-50%) 的百分比在合成层动画开始时按当时宽度定死（页面刚加载时内容为空、宽度为 0，
   之后填进内容也一直位移 0，要等悬停暂停/恢复才重新计算）。内容变化后重启动画，并保留进度。 */
function restartTicker(run){
  const old=run.getAnimations()[0], t=old?old.currentTime:0;
  run.style.animation="none"; void run.offsetWidth; run.style.animation="";
  const an=run.getAnimations()[0]; if(an&&t) an.currentTime=t;
}

/* 回复浮层：悬停 ↳ 行显示全文，点击固定（再点/点别处/Esc 关闭）；浮层挂在 body 上，不占泳道高度 */
const rtip = document.createElement("div"); rtip.id = "rtip"; document.body.appendChild(rtip);
let rtHover = null;
function rtEl(k){ return k==null ? null : document.querySelector(`.l3[data-reply="${CSS.escape(k)}"]`) }
function rtShow(){
  if(S.pinReply!=null && !rtEl(S.pinReply)) S.pinReply = null;      // 那一行已不在列表里
  const k = S.pinReply ?? rtHover, el = rtEl(k);
  document.querySelectorAll(".l3.open").forEach(x => { if(x!==el || S.pinReply==null) x.classList.remove("open") });
  if(el && S.pinReply!=null) el.classList.add("open");
  const r = el && el.getBoundingClientRect();
  const txt = el ? el.querySelector(".rt").textContent : "", tool = el ? (el.querySelector(".tool")?.textContent || "") : "";
  if(!el || (!txt && !tool) || !r.width || r.bottom < 0 || r.top > innerHeight){ rtip.style.display = "none"; return }
  rtip.classList.toggle("pin", S.pinReply!=null);
  rtip.innerHTML = (tool ? `<span class="tn">${h(tool)}</span>` : "") + h(txt);
  rtip.style.left = "0px"; rtip.style.display = "block";   // 先回到左侧再量尺寸，免得贴右边时宽度被挤窄
  const t = rtip.getBoundingClientRect(), pad = 8;
  const x = Math.max(pad, Math.min(r.left + 14, innerWidth - t.width - pad));
  const y = r.bottom + 6 + t.height <= innerHeight - pad ? r.bottom + 6 : Math.max(pad, r.top - 6 - t.height);
  rtip.style.left = x + "px"; rtip.style.top = y + "px";
}
document.addEventListener("mouseover", e => { const el = e.target.closest(".l3[data-reply]"); const k = el ? el.dataset.reply : null; if(k!==rtHover){ rtHover = k; rtShow() } });
document.addEventListener("scroll", () => { if(rtip.style.display==="block") rtShow() }, true);
addEventListener("resize", () => { if(rtip.style.display==="block") rtShow() });
addEventListener("keydown", e => { if(e.key==="Escape" && S.pinReply!=null){ S.pinReply = null; rtShow(); e.stopImmediatePropagation() } }, true);

function render(){
  if(!S.data) return;
  patch($("eyebrow"),`AGENT DECK · <span style="text-transform:none;color:var(--text)">${h(S.data.host)}</span> · 值班台`);
  renderStats(); renderSources(); renderJobs(); renderAxis(); renderLanes(); renderLog();
  if(API.onRender) API.onRender();
  rtShow();
}

function tickClock(){
  const d=new Date(now()); const p=n=>String(n).padStart(2,"0");
  $("clock").innerHTML=`${p(d.getHours())}:${p(d.getMinutes())}<span class="s">:${p(d.getSeconds())}</span>`;
  const off=-d.getTimezoneOffset()/60;
  $("date").textContent=d.toLocaleDateString("en-US",{weekday:"short",day:"2-digit",month:"short"}).toUpperCase().replace(",","")+` · GMT${off>=0?"+":""}${off}`;
}

/* 页面层统一轮询后把数据交进来；d 为空表示这次没拉到（显示 OFFLINE，沿用旧数据） */
const API={sel:null,onRender:null,onSelect:null,isSel:(src,id)=>src+"|"+id===API.sel,S,patch,render:()=>render(),ingest};
function ingest(d, ok){
  S.ok=ok;
  if(d){ S.data=d; S.skew=d.now-Date.now();
    $("upd").textContent=(d.devices?`设备 ${d.devices.length?d.devices.map(x=>x.name).join("、"):"无（等待推送）"} · `:"")+"更新于 "+hm(Date.now(),true); }
  $("live").classList.toggle("off",!S.ok); $("live").querySelector("span").textContent=S.ok?"LIVE":"OFFLINE";
  const sc=$("log").scrollTop; render(); $("log").scrollTop=sc;
}

document.addEventListener("click",e=>{
  if(S.pinReply!=null && !e.target.closest("#rtip,[data-reply]")){ S.pinReply=null; rtShow(); }
  const t=e.target.closest("[data-src],[data-job],[data-win],[data-all],[data-reply],[data-lead]"); if(!t) return;
  if(t.dataset.lead!==undefined){ if(API.onSelect) API.onSelect(t.dataset.lead); return; }
  if(t.dataset.reply!==undefined){const k=t.dataset.reply; S.pinReply = S.pinReply===k ? null : k; rtShow(); return;}
  if(t.dataset.src){const k=t.dataset.src; S.off.has(k)?S.off.delete(k):S.off.add(k); localSet("off",JSON.stringify([...S.off]))}
  else if(t.dataset.job){S.job = S.job===t.dataset.job? null : t.dataset.job}
  else if(t.dataset.win){S.win=+t.dataset.win; localSet("win",S.win)}
  else if(t.dataset.all){const k=t.dataset.all; S.showAll.has(k)?S.showAll.delete(k):S.showAll.add(k)}
  render();
});

tickClock(); setInterval(tickClock,1000);
setInterval(()=>{ if(S.data){ renderAxis(); } },15000);

return API;
})();
</script>
<script>
"use strict";
/* ============================================================
   页面编排：主题（自动 / 白天 / 夜晚）、任务栏、选中任务 → 办公室、排班抽屉、全屏、统一轮询
   体素场景（第一段脚本）不可用时（无 WebGL2），其余部分照常工作
   ============================================================ */
const APP = {theme: "auto", sel: null, drawer: false, full: false, first: true, data: null};
try { APP.theme = localStorage.getItem("deck.theme") || "auto"; APP.sel = localStorage.getItem("deck.sel"); const lanes = localStorage.getItem("deck.lanes"); localStorage.removeItem("deck.drawer");
      APP.drawer = lanes == null ? innerWidth >= 900 : lanes === "1" } catch {}   // 泳道默认打开（窄屏会盖住办公室，仍默认收起）；之后按用户的开关记忆
if (!["auto", "light", "night"].includes(APP.theme)) APP.theme = "auto";
const keep = (k, v) => { try { v == null ? localStorage.removeItem("deck." + k) : localStorage.setItem("deck." + k, v) } catch {} };
const MAP_KEEP = 30 * 60e3;                                // 与办公室一致：任务结束 30 分钟内仍在任务栏上
const isLive = l => l.status === "working" || l.status === "idle";
const ST_VAR = {working: "var(--work)", idle: "var(--idle)", finished: "var(--done)", done: "var(--done)", stopped: "var(--stop)", failed: "var(--fail)"};
const sceneOK = () => window.SCENE_OK === true;

/* ---------------- 主题：自动档按服务器时间（6:00–18:00 白天） ---------------- */
function serverHour(){ const d = new Date(Date.now() + (Deck.S.skew || 0)); return d.getHours() + d.getMinutes() / 60 }
function applyTheme(){
  const hr = serverHour();
  const t = APP.theme === "light" ? "light" : APP.theme === "night" ? "night" : (hr >= 6 && hr < 18 ? "light" : "night");
  const root = document.documentElement;
  if (root.dataset.theme !== t){
    root.dataset.theme = t;
    document.querySelector('meta[name="theme-color"]').content = t === "light" ? "#f2efe8" : "#0c0d10";
    if (Deck.S.data) Deck.render();                            // 职位颜色随主题加深 / 还原
  }
  if (sceneOK()) S.themeMode = APP.theme;                      // 办公室“跟随”档：白天固定中午、夜晚固定夜里、自动按真实时间
  for (const b of $("theme").querySelectorAll("button")) b.classList.toggle("on", b.dataset.theme === APP.theme);
}

/* ---------------- 项目：按设备分组，同一设备上 project 相同的会话归为一个项目（任务栏顺序 = ←/→ 切换顺序） ---------------- */
const projName = l => l.project || l.title || l.name || "未命名";
const projKey = (d, l) => devOf(d, l.src) + "|" + projName(l);
const byLive = (a, b) => isLive(b) - isLive(a) || (isLive(a) ? a.start - b.start : b.last - a.last);
function projFrom(key, leads){
  const live = leads.filter(isLive), st = leads.some(l => l.status === "working") ? "working" : live.length ? "idle" : leads[0].status;
  return {key, name: projLabel(projName(leads[0])), leads, status: st, src: leads[0].src,
          start: Math.min(...(live.length ? live : leads).map(l => l.start)), last: Math.max(...leads.map(l => l.last))};
}
function mapGroups(d){
  const now = d.now, off = Deck.S.off, groups = new Map(), at = n => { if (!groups.has(n)) groups.set(n, new Map()); return groups.get(n) };
  const put = l => { const g = at(devOf(d, l.src)), k = projKey(d, l); if (!g.has(k)) g.set(k, []); g.get(k).push(l) };
  for (const x of d.devices || []) at(x.name);
  let selSeen = false;
  for (const l of d.leads || []){
    if (off.has(l.src) || !(isLive(l) || now - l.last < MAP_KEEP)) continue;
    put(l); if (projKey(d, l) === APP.sel) selSeen = true;
  }
  // 选中的项目已经全部结束超过 30 分钟：只把它最近的一个会话留在任务栏上，不把更早的老会话都搬回来
  if (APP.sel && !selSeen){ const l = (d.leads || []).filter(x => !off.has(x.src) && projKey(d, x) === APP.sel).sort((a, b) => b.last - a.last)[0]; if (l) put(l) }
  if (!groups.size) at(d.host || "本机");
  return [...groups].sort((a, b) => a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : 0).map(([dev, pm]) => ({dev, hex: DEV_HEX[hashStr(dev) % DEV_HEX.length],
    tasks: [...pm].map(([k, ls]) => projFrom(k, ls.sort(byLive))).sort(byLive)}));
}
const allTasks = () => APP.data ? mapGroups(APP.data).flatMap(g => g.tasks) : [];
const selProject = () => allTasks().find(p => p.key === APP.sel) || null;
const sumBusy = ls => ls.filter(isLive).reduce((n, l) => n + (l.status === "working" ? 1 : 0) + l.agents.filter(a => a.status === "working").length, 0);
/* 选中的任务不在了（超出时间窗 / 被档位筛掉）就换一个：优先在忙的，其次在线的 */
function pickSel(){
  const tasks = allTasks();
  if (APP.sel && tasks.some(p => p.key === APP.sel)) return false;
  const p = tasks.find(x => x.status === "working") || tasks.find(isLive) || tasks[0] || null;
  const k = p ? p.key : null, changed = k !== APP.sel;
  APP.sel = k; Deck.sel = k;
  return changed;
}
function select(k){
  if (!k || k === APP.sel) return;
  APP.sel = k; Deck.sel = k; keep("sel", k);
  Deck.render();                                               // 排班高亮 + 地图 + 办公室标题（onRender）
  if (sceneOK()) sceneReplay();                                // 进入新办公室：重新铺设
  revealTile(); if (APP.drawer) revealLane($("lanes").querySelector(".blk.sel"), false);
}
/* 只滚动各自的容器（不用 scrollIntoView，避免把 overflow:hidden 的外层面板也滚动） */
function revealTile(){
  const el = $("mapbody").querySelector(".tab.sel"); if (!el) return;
  const m = el.parentElement;
  const r = el.getBoundingClientRect(), mr = m.getBoundingClientRect();
  if (r.left < mr.left) m.scrollTo({left: m.scrollLeft + r.left - mr.left - 12, behavior: "smooth"});
  else if (r.right > mr.right) m.scrollTo({left: m.scrollLeft + r.right - mr.right + 12, behavior: "smooth"});
}
function revealLane(el, center){
  const L = $("lanes"); if (!el) return;
  const r = el.getBoundingClientRect(), lr = L.getBoundingClientRect();
  L.scrollTo({top: L.scrollTop + r.top - lr.top - (center ? Math.max(0, (L.clientHeight - r.height) / 2) : 10), behavior: "smooth"});
}
function step(dir){
  const ts = allTasks(); if (ts.length < 2) return;
  const i = ts.findIndex(p => p.key === APP.sel);
  select(ts[((i < 0 ? 0 : i + dir) + ts.length) % ts.length].key);
}

/* ---------------- 任务栏：一台设备一行，每个项目一个标签 ---------------- */
function tabHTML(p, srcLabel){
  const now = APP.data.now, live = isLive(p), sel = p.key === APP.sel, busy = sumBusy(p.leads), subs = p.leads.reduce((n, l) => n + l.agents.length, 0);
  const tm = live ? `${busy ? `<em>${busy} 忙</em> · ` : ""}${p.leads.length > 1 ? `会话 ${p.leads.length} · ` : ""}子 ${subs}` : `已结束 · ${dur(now - p.last)} 前`;
  const tip = [p.name, ...p.leads.map(l => `· ${l.title || l.name}（主管 ${l.name}${srcLabel.get(l.src) ? " · " + srcLabel.get(l.src) : ""}）`)].join("\n");
  return `<button class="tab ${sel ? "sel" : ""} ${live ? "" : "off"} ${p.status === "working" ? "working" : ""}" data-task="${h(p.key)}" data-key="t:${h(p.key)}" role="tab" aria-selected="${sel}"`
    + ` title="${h(tip)}"><i style="background:${ST_VAR[p.status] || "var(--stop)"}"></i><span class="tt">${h(p.name)}</span><span class="tm">${tm}</span></button>`;
}
function renderMap(){
  const d = APP.data; if (!d) return;
  const groups = mapGroups(d), srcLabel = new Map((d.sources || []).map(s => [s.id, String(s.label).split(" · ")[0]]));
  Deck.patch($("mapbody"), groups.map(g => { const b = sumBusy(g.tasks.flatMap(p => p.leads));
    return `<div class="drow" data-key="d:${h(g.dev)}"><div class="dname" title="${h(g.dev)}"><i style="background:${g.hex}"></i><b>${h(g.dev)}</b><small>${g.tasks.length} 项目${b ? ` · <em>${b} 忙</em>` : ""}</small></div>`
      + `<div class="dtabs" role="tablist">${g.tasks.map(l => tabHTML(l, srcLabel)).join("") || `<span class="dempty">暂无项目</span>`}</div></div>` }).join(""));
  const lv = (d.leads || []).filter(l => !Deck.S.off.has(l.src) && isLive(l));
  $("lanesn").textContent = `${lv.length} 会话 · ${lv.reduce((n, l) => n + l.agents.filter(a => a.status === "working").length, 0)} 在岗`;
}
/* 办公室左上角：当前项目名牌 + 上一个 / 下一个 */
function renderTitle(){
  const d = APP.data, p = d && selProject(), many = allTasks().length > 1;
  if (!p){ Deck.patch($("otitle"), `<i style="background:#9aa3ad"></i><b>空办公室</b><span>暂无项目</span>`); return }
  const busy = sumBusy(p.leads), subs = p.leads.reduce((n, l) => n + l.agents.length, 0);
  const who = p.leads.length > 1 ? `${p.leads.length} 个会话` : `主管 ${p.leads[0].name}`;
  Deck.patch($("otitle"), (many ? `<button data-nav="-1" title="上一个项目（←）">${IC.caretL}</button>` : "")
    + `<i style="background:${ST_COL[p.status] || "#9aa3ad"}"></i><b title="${h(p.name)}">${h(p.name)}</b><span class="who">${h(who)} · ${h(devOf(d, p.src))}</span>`
    + `<span>子 ${subs}${busy ? ` · <em>${busy} 在忙</em>` : ""}</span>` + (many ? `<button data-nav="1" title="下一个项目（→）">${IC.caretR}</button>` : ""));
}

/* ---------------- 排班抽屉 / 全屏 ---------------- */
function drawerPad(){ if (!APP.drawer) return 0; const w = $("drawer").offsetWidth; return $("office").clientWidth - w >= 320 ? w : 0 }   // 剩余不足 320px 时仍按覆盖处理，办公室不挤得太小
function syncDrawerPad(animate){
  $("office").classList.toggle("lanes-open", drawerPad() > 0);
  if (!sceneOK() || !S.world) return;
  S.autoFit = true;
  const b = fitTarget(); if (!b) return;
  if (animate) S.tween = {a: {...cam}, b, t0: performance.now(), dur: 420}; else { S.tween = null; Object.assign(cam, b) }
}
function setDrawer(on, save = true){   // save=false：默认值或自动收起，不写入记忆
  APP.drawer = on; if (save) keep("lanes", on ? "1" : "0");
  $("drawer").classList.toggle("open", on); $("lanesBtn").classList.toggle("on", on); $("lanesBtn").setAttribute("aria-expanded", String(on));
  syncDrawerPad(true);                                         // 办公室移到抽屉左侧的剩余区域居中
  if (on && Deck.S.data) requestAnimationFrame(() => { Deck.render(); revealLane($("lanes").querySelector(".blk.sel"), false) });   // 时间轴刻度按抽屉宽度重排，并定位到当前任务
}
function setFull(on){
  APP.full = on; document.body.classList.toggle("full", on);
  $("zfull").innerHTML = on ? IC.close : IC.full; $("zfull").title = on ? "退出全屏（Esc）" : "全屏办公室";
}

/* ---------------- 轮询：一次拉取，分发给看板（顶部 / 排班 / 日志）、地图和办公室 ---------------- */
async function poll(){
  let d = null, ok = true;
  try { const r = await fetch("/api/state", {cache: "no-store"}); if (!r.ok) throw 0; d = await r.json() } catch { ok = false }
  if (!d && APP.first && sceneOK()) d = DEMO;                 // 首次就连不上：先用演示数据把办公室摆出来
  if (!d){ Deck.ingest(null, ok); return }
  APP.data = d; Deck.S.skew = d.now - Date.now();
  if (APP.first){ const cur = selProject(); if (!cur || !isLive(cur)) APP.sel = null }   // 刷新后优先看在线的项目
  const switched = pickSel(); if (switched) keep("sel", APP.sel);
  Deck.sel = APP.sel;
  Deck.ingest(d, ok);
  if (sceneOK()) sceneUpdate(d, APP.first || switched);
  if (APP.first || switched) requestAnimationFrame(revealTile);
  APP.first = false;
  applyTheme();
}

/* ---------------- 交互 ---------------- */
Deck.onSelect = k => { const l = APP.data && (APP.data.leads || []).find(x => leadKey(x) === k); if (l) select(projKey(APP.data, l)); if (innerWidth < 900) setDrawer(false, false) };   // 点排班里的会话 → 切到它所在的项目
Deck.isSel = (src, id) => { const l = APP.data && (APP.data.leads || []).find(x => x.src === src && x.id === id); return !!l && projKey(APP.data, l) === APP.sel };   // 排班 / 日志高亮当前项目的所有会话
Deck.onRender = () => {
  if (!APP.data) return;
  if (pickSel()){ keep("sel", APP.sel); setTimeout(() => { Deck.render(); if (sceneOK()) sceneReplay() }) }   // 当前任务被档位筛掉了
  renderMap(); renderTitle();
};
if (sceneOK()) fitPadRight = drawerPad;
if (sceneOK()) selLeads = () => (selProject() || {leads: []}).leads;   // 办公室只摆选中项目的会话
if (sceneOK()) onPersonClick = p => {                         // 抽屉开着时，点小人 → 在排班里定位到对应行
  if (!APP.drawer || !p.z || !p.z.lead) return;
  const l = p.z.lead, q = p.boss ? `[data-lead="${CSS.escape(leadKey(l))}"]` : `[data-key="a:${CSS.escape(p.d.id)}"]`;
  let el = $("lanes").querySelector(q);
  if (!el && !p.boss){ Deck.S.showAll.add(l.id); Deck.render(); el = $("lanes").querySelector(q) }
  if (el){ revealLane(el, true); el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash") }
};
/* 页面主题与办公室时段联动：自动 ↔ 跟随，白天 → 中午，夜晚 → 夜晚；
   反过来选时段时，跟随 → 自动，其余按 6:00–18:00 定白天 / 夜晚（早上、中午、黄昏为白天） */
const THEME_HOUR = {auto: "auto", light: "13", night: "21.5"};
function syncHourToTheme(){
  if (!sceneOK()) return;
  const h = THEME_HOUR[APP.theme]; S.hourMode = h;
  for (const x of $("timebar").querySelectorAll("button")) x.classList.toggle("on", x.dataset.h === h);
}
$("theme").addEventListener("click", e => { const b = e.target.closest("button[data-theme]"); if (!b) return; APP.theme = b.dataset.theme; keep("theme", APP.theme); applyTheme(); syncHourToTheme() });
$("timebar").addEventListener("click", e => {
  const b = e.target.closest("button[data-h]"); if (!b) return;
  const h = b.dataset.h, t = h === "auto" ? "auto" : (+h >= 6 && +h < 18 ? "light" : "night");
  if (t !== APP.theme){ APP.theme = t; keep("theme", t); applyTheme() }
});
$("mapbody").addEventListener("click", e => { const t = e.target.closest("[data-task]"); if (t) select(t.dataset.task) });
$("mapbody").addEventListener("wheel", e => { const m = e.target.closest(".dtabs"); if (m && Math.abs(e.deltaY) > Math.abs(e.deltaX) && m.scrollWidth > m.clientWidth){ m.scrollLeft += e.deltaY; e.preventDefault() } }, {passive: false});
$("otitle").addEventListener("click", e => { const b = e.target.closest("[data-nav]"); if (b) step(+b.dataset.nav) });
$("lanesBtn").onclick = () => setDrawer(!APP.drawer);
$("drawerX").onclick = () => setDrawer(false);
$("zfull").onclick = () => setFull(!APP.full);
document.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey || (e.target.closest && e.target.closest("input,select,textarea"))) return;
  if (e.key === "Escape"){ if (APP.full) setFull(false); else if (APP.drawer) setDrawer(false) }
  else if (e.key === "ArrowLeft") step(-1);
  else if (e.key === "ArrowRight") step(1);
});

if (/^\/voxel(\.html)?\/?$/.test(location.pathname)) setFull(true);    // 旧的全屏游戏视图地址仍可用
Deck.S.off.clear();                                         // 主页面不提供档位筛选：不沿用经典看板里隐藏的档位
setDrawer(APP.drawer, false);
applyTheme(); syncHourToTheme();
if (sceneOK()){ resize(); addEventListener("resize", () => { resize(); $("office").classList.toggle("lanes-open", drawerPad() > 0) }) }   // 尺寸观察器之外再保底：首屏即全屏时观察器可能不触发
poll(); setInterval(poll, 3000); setInterval(applyTheme, 5000);
</script>
</body>
</html>
