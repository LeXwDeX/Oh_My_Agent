<!doctype html>
<html lang="zh-CN" data-theme="night">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0c0d10">
<title>Agent Deck · 值班台</title>
<script>
/* 首屏前先定主题，避免闪烁：手动档直接用；自动档先按浏览器时间猜，拿到服务器时间后再校正 */
(function(){var m="auto";try{m=localStorage.getItem("deck.theme")||"auto"}catch(e){}
var h=new Date().getHours(),t=m==="light"?"light":m==="night"?"night":(h>=6&&h<18?"light":"night");
document.documentElement.setAttribute("data-theme",t)})();
</script>
<style>
/* ============ 主题：夜晚（默认）/ 白天，两套色板共用同一组变量 ============ */
:root{color-scheme:dark;
  --bg:#0c0d10; --panel:#131418; --panel2:#17181d; --line:#22242b; --line2:#2c2f37;
  --text:#ebe7df; --dim:#8b877f; --faint:#5b5852;
  --work:#ff9a3c; --idle:#e8c46a; --done:#6fcf8a; --stop:#8c93a3; --fail:#ff6b6b;
  --app:#e08a5f; --cli:#b8b3a8; --ds:#5b9dff; --qwen:#a884ff;
  --accent:#ffd166; --av:#1d1f25;
  --mono:"JetBrains Mono","SF Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
}
:root[data-theme=light]{color-scheme:light;
  --bg:#f2efe8; --panel:#ffffff; --panel2:#faf8f3; --line:#e6e1d6; --line2:#d5cfc2;
  --text:#24221e; --dim:#6b665d; --faint:#9d978b;
  --work:#dd6c0b; --idle:#a47d06; --done:#23935a; --stop:#6c7484; --fail:#d63c3c;
  --app:#c4612f; --cli:#79736a; --ds:#2b74de; --qwen:#7650dc;
  --accent:#f0a800; --av:#efece6;
}
/* ============ 原泳道看板样式（颜色全部走主题变量） ============ */
*{box-sizing:border-box}
.viewlink{font-size:11px;letter-spacing:.16em;color:var(--dim);text-decoration:none;border:1px solid currentColor;border-radius:4px;padding:2px 6px;vertical-align:middle;margin-left:8px;font-weight:400}
.viewlink:hover{color:var(--text)}
.eyebrow{font-size:11px;letter-spacing:.18em;color:var(--dim);text-transform:uppercase}
.dim{color:var(--dim)} .faint{color:var(--faint)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}

/* header */
#top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
h1{font-family:var(--sans);font-size:30px;font-weight:700;margin:6px 0 0;letter-spacing:-.01em}
.clockbox{display:flex;align-items:flex-end;gap:18px}
.livebadge{display:flex;align-items:center;gap:7px;color:var(--work);font-size:11px;letter-spacing:.16em;justify-content:flex-end}
.livebadge i{width:8px;height:8px;border-radius:50%;background:var(--work);box-shadow:0 0 10px var(--work);animation:pulse 1.6s infinite}
.livebadge.off{color:var(--fail)} .livebadge.off i{background:var(--fail);box-shadow:0 0 10px var(--fail)}
@keyframes pulse{50%{opacity:.35}}
.date{font-size:11px;letter-spacing:.14em;color:var(--dim);margin-top:6px;text-align:right}
.clock{font-family:var(--sans);font-size:38px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1}
.clock .s{color:var(--faint)}

/* ticker */
.ticker{margin-top:14px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;align-items:center;height:32px;overflow:hidden}
.ticker .lab{flex:none;padding-right:14px;color:var(--work);font-size:11px;letter-spacing:.16em;border-right:1px solid var(--line);margin-right:14px}
.ticker .track{flex:1;overflow:hidden;mask-image:linear-gradient(90deg,#000 85%,transparent)}
.ticker .run{display:inline-flex;gap:26px;white-space:nowrap;animation:tick 70s linear infinite}
.ticker:hover .run{animation-play-state:paused}
@keyframes tick{to{transform:translateX(-50%)}}
.tk .t{color:var(--faint);margin-right:6px}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;margin:14px 0 12px}
.stat{padding:2px 14px;border-left:1px solid var(--line);min-width:0}
.stat .row2{display:flex;align-items:center;gap:10px;margin-top:4px;min-width:0}
.stat:first-child{border-left:0;padding-left:0}
.stat .k{font-size:10.5px;letter-spacing:.16em;color:var(--dim);display:flex;align-items:center;gap:6px}
.stat .k b{width:8px;height:8px;display:inline-block}
.stat .v{font-family:var(--sans);font-size:28px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums;flex:none}
.stat .sub{color:var(--dim);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.stat .col{display:flex;flex-direction:column;gap:5px;flex:1;min-width:0}
.bar{height:5px;background:var(--line);border-radius:3px;overflow:hidden;width:100%}
.bar i{display:block;height:100%;background:var(--work);transition:width .8s ease}

/* sources */
.sources{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.sources .lab{font-size:10.5px;letter-spacing:.16em;color:var(--faint);margin-right:4px}
.src{display:flex;align-items:center;gap:8px;padding:5px 11px;background:var(--panel);border:1px solid var(--line);border-radius:999px;transition:border-color .15s,opacity .15s;white-space:nowrap}
.src:hover{border-color:var(--line2)}
.src.off{opacity:.38}
.src .dot{width:10px;height:10px;border-radius:3px;flex:none}
.src .nm{font-weight:700;font-size:12px}
.src .meta{font-size:11px;color:var(--dim)}
.src .meta em{font-style:normal;color:var(--work)}

/* layout */
.grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(250px,1fr);gap:14px;align-items:start}
@media (min-width:1300px){.grid{grid-template-columns:minmax(0,1fr) 340px}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px}
.ph{display:flex;align-items:baseline;gap:12px;padding:16px 16px 10px;flex-wrap:wrap}
.ph h2{font-family:var(--sans);font-size:19px;font-weight:600;margin:0}
.ph .note{font-size:11.5px;color:var(--dim)}
.ph .sp{flex:1}
.seg{display:flex;border:1px solid var(--line2);border-radius:7px;overflow:hidden}
.seg button{padding:3px 9px;font-size:11px;color:var(--dim)}
.seg button.on{background:var(--line2);color:var(--text)}

.chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 12px}
.chip{font-size:11.5px;padding:3px 9px;border-radius:999px;border:1px solid var(--line2);color:var(--faint)}
.chip.has{color:var(--c);border-color:color-mix(in srgb,var(--c) 45%,transparent);background:color-mix(in srgb,var(--c) 10%,transparent)}
.chip.sel{background:color-mix(in srgb,var(--c) 26%,transparent);color:var(--text)}
.chip .n{opacity:.75;margin-left:4px}

/* lanes */
.lanes{--L:minmax(0,46%);--R:86px}
.lhead,.row{display:grid;grid-template-columns:var(--L) minmax(40px,1fr) var(--R);align-items:center}
.lhead{font-size:10.5px;letter-spacing:.14em;color:var(--faint);padding:8px 16px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.lhead .ax{position:relative;height:14px}
.lhead .ax span{position:absolute;transform:translateX(-50%);top:0;white-space:nowrap}
.lhead .ax .now{color:var(--work)}
.lhead .w{text-align:right}
.group{margin:10px 10px 0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel2)}
.group.lv{background:linear-gradient(180deg,color-mix(in srgb,var(--work) 6%,var(--panel2)),var(--panel2) 70%)}
.gh{display:flex;justify-content:space-between;font-size:10.5px;letter-spacing:.14em;color:var(--faint);padding:9px 12px;border-bottom:1px solid var(--line)}
.blk{margin:6px 6px 0;border-radius:9px;background:color-mix(in srgb,var(--sc) 5%,transparent);border:1px solid color-mix(in srgb,var(--sc) 12%,transparent);overflow:hidden}
.blk.w{background:color-mix(in srgb,var(--work) 6%,transparent);border-color:color-mix(in srgb,var(--work) 18%,transparent)}
.row{padding:6px 10px;min-height:48px;position:relative}
.row.lead{min-height:54px}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.row.lead.kids::after{content:"";position:absolute;left:30px;top:calc(50% + 20px);bottom:0;border-left:2px solid color-mix(in srgb,var(--sc) 60%,transparent)}
.child::before{content:"";position:absolute;left:30px;top:0;height:50%;width:18px;border-left:2px solid color-mix(in srgb,var(--sc) 60%,transparent);border-bottom:2px solid color-mix(in srgb,var(--sc) 60%,transparent);border-bottom-left-radius:8px}
.child.mid::after{content:"";position:absolute;left:30px;top:50%;bottom:0;border-left:2px solid color-mix(in srgb,var(--sc) 60%,transparent)}
.child .av{margin-left:40px}
.av{width:34px;height:34px;border-radius:8px;flex:none;border:1.5px solid var(--line2);background:var(--av);position:relative}
.av img{width:100%;height:100%;display:block;border-radius:6px;object-fit:cover}
.avi{display:block;width:100%;height:100%;overflow:hidden;border-radius:6px}
.avi img{transform:scale(1.15);transform-origin:50% 50%}   /* 头像框不变，内部画面放大 15% */
.enter{animation:enter .45s ease-out}
@keyframes enter{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.av svg{width:100%;height:100%;display:block;border-radius:6px;image-rendering:pixelated}
.row.lead .av{width:40px;height:40px}
.av .sb{position:absolute;right:-4px;bottom:-4px;width:12px;height:12px;border-radius:4px;border:2px solid var(--panel2)}
.row.isw .av{border-color:var(--work);box-shadow:0 0 0 2px color-mix(in srgb,var(--work) 20%,transparent)}
.txt{min-width:0;flex:1}
.l1{display:flex;align-items:baseline;gap:8px;white-space:nowrap;overflow:hidden}
.l1 .n{font-weight:700;font-size:13.5px}
.l1 .job{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase}
.l1 .mdl{font-size:11px;color:var(--faint);overflow:hidden;text-overflow:ellipsis}
.l2{display:flex;gap:8px;align-items:baseline;font-size:11.5px;margin-top:3px;white-space:nowrap;overflow:hidden}
.l2 .task{color:var(--dim);overflow:hidden;text-overflow:ellipsis}
/* flex 居中：工具徽标与回复文字共用一条中线 */
.l3{display:flex;align-items:center;font-size:11px;color:var(--faint);margin-top:3px;white-space:nowrap;overflow:hidden;cursor:pointer;max-width:100%}
.l3::before{content:"↳";margin-right:.35em;flex:none;color:var(--text)}
.l3 .rt{min-width:0;overflow:hidden;text-overflow:ellipsis}
.l3 .tool{display:inline-flex;align-items:center;gap:3px;font-size:10px;letter-spacing:.04em;color:var(--work);border:1px solid color-mix(in srgb,var(--work) 40%,transparent);border-radius:4px;padding:3px 5px 3px 3px;margin-right:6px;line-height:9px;flex:none}
.l3 .tool svg{flex:none;width:9px;height:9px;display:block}
.l3.open{align-items:flex-start;white-space:normal;color:var(--dim);line-height:1.5;background:color-mix(in srgb,var(--line) 40%,transparent);border-radius:5px;padding:4px 6px;margin-top:4px}
.row.hasreply{min-height:60px}
.st{font-size:10.5px;letter-spacing:.12em;flex:none}
.st.working{color:var(--work)} .st.idle{color:var(--idle)} .st.finished,.st.done{color:var(--done)} .st.stopped{color:var(--stop)} .st.failed{color:var(--fail)}
/* 加载动画：盲文点阵逐帧切换（不旋转字形，避免字形重心不在中心时偏心转动） */
.spin{display:inline-block;width:1ch;text-align:center}
.spin::before{content:"⠋";animation:dots-spin .8s steps(1,end) infinite}
@keyframes dots-spin{0%{content:"⠋"}10%{content:"⠙"}20%{content:"⠹"}30%{content:"⠸"}40%{content:"⠼"}50%{content:"⠴"}60%{content:"⠦"}70%{content:"⠧"}80%{content:"⠇"}90%{content:"⠏"}}
.pill{font-size:11px;border:1px solid var(--line2);border-radius:5px;padding:1px 7px;color:var(--dim);flex:none}
.pill.hot{border-color:color-mix(in srgb,var(--work) 55%,transparent);color:var(--work)}
.tl{position:relative;height:100%;min-height:30px;margin:0 6px}
.tl .seg-b{transition:left .8s ease,width .8s ease;position:absolute;top:50%;height:12px;transform:translateY(-50%);border-radius:3px;min-width:3px;background:var(--c);opacity:.85}
.tl .seg-b.ghost{opacity:.35}
.tl .nowl{position:absolute;top:-8px;bottom:-8px;width:1.5px;background:color-mix(in srgb,var(--work) 70%,transparent)}
.tl .orb{position:absolute;top:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(circle,#fff 0 25%,var(--work) 55%,transparent 72%);box-shadow:0 0 18px 4px color-mix(in srgb,var(--work) 55%,transparent);animation:pulse 1.6s infinite}
.wk{text-align:right}
.wk .d{font-weight:700;font-variant-numeric:tabular-nums}
.wk .s{font-size:11px;color:var(--faint);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wk{min-width:0}
.more{padding:8px 12px 9px 92px;font-size:11.5px;color:var(--dim);border-top:1px solid var(--line)}
.more button{color:var(--text);text-decoration:underline;text-decoration-color:var(--line2);text-underline-offset:3px}
.lead .tgl{font-size:11px;color:var(--faint);margin-left:4px}
.empty{padding:26px 16px;color:var(--faint);text-align:center}
.lanesbody{padding-bottom:12px}

/* log */
.log .ph{padding-bottom:8px}
.logl{max-height:calc(100vh - 240px);min-height:420px;overflow:auto;padding:0 6px 8px}
.ev{display:grid;grid-template-columns:60px 64px minmax(0,1fr);gap:6px;padding:7px 10px;font-size:12px;border-radius:6px;align-items:baseline}
.ev:nth-child(odd){background:color-mix(in srgb,var(--line) 35%,transparent)}
.ev.hl{background:color-mix(in srgb,var(--work) 12%,transparent)}
.ev .t{color:var(--dim);font-variant-numeric:tabular-nums}
.ev .k{font-size:10px;letter-spacing:.12em;color:var(--faint)}
.ev .k.on{color:var(--work)} .ev .k.finished,.ev .k.done{color:var(--done)} .ev .k.failed{color:var(--fail)}
.ev .w{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev .w b{font-weight:700}
.logl::-webkit-scrollbar{width:6px}.logl::-webkit-scrollbar-thumb{background:var(--line2);border-radius:3px}
footer{margin-top:14px;font-size:11px;color:var(--faint);display:flex;justify-content:space-between}

@media (max-width:860px){.lanes{--L:minmax(0,58%);--R:74px}.stat .sub{display:none}.stat .col .bar{display:block}}
@media (max-width:720px){.grid{grid-template-columns:1fr}.logl{max-height:420px}}
@media (max-width:560px){.stats{grid-template-columns:repeat(2,1fr);row-gap:12px}.stat:nth-child(3){border-left:0;padding-left:0}.lanes{--L:minmax(0,1fr);--R:64px}.lhead .ax,.tl{display:none}.lhead,.row{grid-template-columns:minmax(0,1fr) var(--R)}h1{font-size:24px}.clock{font-size:28px}}


/* ============ 页面骨架：顶部 / 任务栏 / 常规栏 + 排班 / 办公室 | 日志 ============ */
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--mono);font-size:13px;-webkit-font-smoothing:antialiased}
body{height:100vh;height:100dvh;display:grid;grid-template-columns:minmax(0,1fr) 340px;grid-template-rows:auto auto auto auto minmax(0,1fr);gap:10px 12px;padding:12px 14px;overflow:hidden;transition:background-color .5s,color .5s}
#top{grid-area:1/1/2/3;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:end;gap:26px}
.ticker{grid-area:2/1/3/3;margin:0}
#map{grid-area:3/1/4/3}
#toolbar{grid-area:4/1/5/2}
#office{grid-area:5/1/6/2}
#logp{grid-area:4/2/6/3}
#top h1{font-size:24px;margin-top:4px}
#top .clock{font-size:32px}
#top .stats{margin:0}

/* 任务栏：一台设备一行，左边机器名，右边是这台机器上的任务标签（多了横向滚动） */
.map{padding:2px 0;min-width:0}
/* 整块是一个两列网格（行用 display:contents），各行的机器名列宽一致 */
.mapbody{display:grid;grid-template-columns:max-content minmax(0,1fr)}
.drow{display:contents}
.drow+.drow>*{border-top:1px solid var(--line)}
.dname{display:flex;align-items:center;gap:7px;padding:0 14px;min-height:38px;max-width:280px;min-width:0;white-space:nowrap;border-right:1px solid var(--line)}
.dname i{flex:none;width:8px;height:8px;border-radius:2px}
.dname b{font:600 12.5px var(--sans);overflow:hidden;text-overflow:ellipsis}
.dname small{flex:none;font-size:11px;color:var(--dim)}
.dname small em{font-style:normal;color:var(--work);font-weight:700}
.dtabs{display:flex;align-items:center;gap:4px;overflow-x:auto;padding:4px 8px;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 24px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 24px),transparent)}
.dtabs::-webkit-scrollbar{display:none}
.tab{flex:none;display:flex;align-items:center;gap:7px;max-width:270px;padding:4px 10px;border-radius:7px;border:1px solid transparent;white-space:nowrap;color:var(--text)}
.tab:hover{background:var(--panel2);border-color:var(--line)}
.tab.sel{background:color-mix(in srgb,var(--accent) 16%,var(--panel));border-color:color-mix(in srgb,var(--accent) 60%,transparent)}
.tab i{flex:none;width:7px;height:7px;border-radius:50%}
.tab.working i{box-shadow:0 0 0 3px color-mix(in srgb,var(--work) 22%,transparent)}
.tab .tt{overflow:hidden;text-overflow:ellipsis;font:600 12.5px var(--sans)}
.tab .tm{flex:none;font-size:11px;color:var(--dim)}
.tab .tm em{font-style:normal;color:var(--work);font-weight:700}
.tab.off{color:var(--dim)}
.tab.off .tt{font-weight:400}
.dempty{font-size:11.5px;color:var(--faint);padding:0 4px}

/* 常规栏：主题 / 版式；右侧是排班（泳道图）开关 */
.toolbar{display:flex;align-items:center;gap:10px;min-width:0}
.tb-main{flex:1;min-width:0;display:flex;align-items:center;gap:10px;overflow-x:auto;scrollbar-width:none;padding:1px}
.tb-main::-webkit-scrollbar{display:none}
.tb-main .seg{flex:none;background:var(--panel)}
.seg.theme button{padding:5px 10px;font-size:12px}
.laysel{flex:none;display:flex;align-items:center;gap:4px;padding:1px 4px 1px 10px;border:1px solid var(--line2);border-radius:7px;background:var(--panel);font-size:11px;color:var(--dim)}
.laysel select{background:transparent;color:var(--text);border:0;font:inherit;font-size:12px;padding:4px 2px;cursor:pointer;outline:none}
.laysel select option{color:#1e2740;background:#fff}
.tb-lanes{flex:none;display:flex;align-items:center;gap:8px;padding:6px 14px;border:1px solid var(--line2);border-radius:9px;background:var(--panel);font:700 12.5px var(--sans);color:var(--text)}
.tb-lanes small{font:400 11px var(--mono);color:var(--dim)}
.tb-lanes:hover{border-color:var(--dim)}
.tb-lanes.on{background:color-mix(in srgb,var(--accent) 20%,var(--panel));border-color:color-mix(in srgb,var(--accent) 65%,transparent)}
.tb-lanes .ar{display:inline-block;transition:transform .25s}
.tb-lanes.on .ar{transform:rotate(180deg)}

/* 排班抽屉：从办公室右侧推出，内容就是原来的泳道图 */
.drawer{position:absolute;top:0;right:0;bottom:0;width:clamp(420px,56%,760px);max-width:100%;z-index:6;display:flex;flex-direction:column;border-radius:14px 0 0 14px;border-right:0;box-shadow:-14px 0 34px #0006;transform:translateX(104%);visibility:hidden;transition:transform .32s cubic-bezier(.2,.8,.2,1),visibility 0s .32s}
.drawer.open{transform:none;visibility:visible;transition:transform .32s cubic-bezier(.2,.8,.2,1),visibility 0s}
.drawer .lanesbody{flex:1;min-height:0;overflow:auto}
.drawer .ph .x{font-size:14px;color:var(--dim);padding:2px 6px;border-radius:6px}
.drawer .ph .x:hover{color:var(--text);background:var(--line)}
.row.lead[data-lead]{cursor:pointer}
.blk.sel{box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 70%,transparent)}
.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%,35%{background:color-mix(in srgb,var(--accent) 32%,transparent)}}

/* 日志列 */
.log{display:flex;flex-direction:column;min-height:0;min-width:0}
.log .logl{flex:1;min-height:0;max-height:none}
.log footer{margin:0;padding:8px 12px;border-top:1px solid var(--line);gap:10px}

.ev.cur{box-shadow:inset 2px 0 0 var(--accent)}

/* ============ 办公室（WebGL 体素场景） ============ */
.office{position:relative;overflow:hidden;border-radius:14px;border:1px solid var(--line);min-height:280px;isolation:isolate;background:#74c0ff}
body.full .office{position:fixed;inset:0;z-index:50;border-radius:0;border:0}
#sky{position:absolute;inset:0;z-index:0;pointer-events:none}
#stars{position:absolute;inset:0 0 35% 0;z-index:0;pointer-events:none;opacity:0}
#stars i{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;animation:tw 3s ease-in-out infinite}
@keyframes tw{50%{opacity:.25}}
.celes{position:absolute;z-index:0;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;pointer-events:none}
#sun{background:radial-gradient(circle,#fffbe6 0 45%,#ffe58a 46% 60%,#ffd34d00 72%);filter:drop-shadow(0 0 22px #ffe28a)}
/* 月牙：透明圆 + 偏移的同尺寸外阴影；外阴影不画在元素自身下面，剩下的就是一弯月牙 */
#moon{width:40px;height:40px;margin:-20px 0 0 -20px;background:transparent;box-shadow:11px -7px 0 0 #f6f1d2;filter:drop-shadow(0 0 9px #fff3c4aa)}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;z-index:1}
#gl.drag{cursor:grabbing} #gl.pick{cursor:pointer}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:2}
.hud{background:#1e2740eb;color:#eef2ff;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:2px solid #34405f;border-radius:10px;box-shadow:0 3px 0 #0f1526,0 6px 16px #0f152640;font-family:var(--sans)}
.ohud{position:absolute;left:10px;right:10px;top:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;z-index:4;pointer-events:none}
.ohud>*{pointer-events:auto}
.otitle{display:flex;align-items:center;gap:8px;padding:4px 6px 4px 10px;font-size:12px;max-width:100%;min-width:0}
.otitle i{flex:none;width:8px;height:8px;border-radius:50%}
.otitle b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:320px;min-width:3em;flex:0 1 auto}
.otitle span{color:#aab4cc;white-space:nowrap}
.otitle em{font-style:normal;color:#7dffb0;font-weight:700}
.otitle button{border:0;background:#2a3655;color:#eef2ff;border-radius:6px;width:24px;height:24px;cursor:pointer;font-size:10px;flex:none}
.otitle button:hover{background:#3a4870}
.otitle button:first-child{margin-left:-4px}
.time{display:flex;align-items:center;gap:4px;padding:4px 5px 4px 11px;font-size:12px}
.time b{font-size:13px;margin-right:6px;min-width:92px}
.time button{border:0;background:transparent;font:inherit;font-size:12px;padding:4px 8px;border-radius:6px;cursor:pointer;color:#aab4cc}
.time button:hover{color:#fff}
.time button.on{background:#ffd166;color:#1e2740;font-weight:700}
.ol{position:absolute;left:0;top:0;display:flex;align-items:center;gap:6px;padding:4px 10px;border-radius:10px;background:#fff;color:#2b2f3a;font:700 12px var(--sans);white-space:nowrap;box-shadow:0 4px 12px #1a2a4a30;opacity:0;transition:opacity .5s}
.ol i{width:8px;height:8px;border-radius:50%}
.zl{position:absolute;left:0;top:0;display:flex;align-items:center;gap:5px;padding:2px 8px;border-radius:8px;background:#ffffffeb;color:#2b2f3a;font:11px var(--sans);white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis;box-shadow:0 2px 8px #1a2a4a26;opacity:0;transition:opacity .4s}
.zl b{font-weight:700;overflow:hidden;text-overflow:ellipsis}
.zl i{flex:none;width:7px;height:7px;border-radius:50%}
.zl small{flex:none;color:#6b7280}
.zl em{flex:none;font-style:normal;color:#2f9e6f;font-weight:700}
.zl.mini{max-width:130px;padding:1px 7px;font-size:10.5px}
.zl.mini small,.zl.mini em{display:none}
.ol.vis,.zl.vis{opacity:1}
.zl.vis{pointer-events:auto;cursor:pointer}
#tip{position:fixed;z-index:60;max-width:320px;padding:9px 12px;border-radius:12px;background:#fffffff5;color:#2b2f3a;border:1px solid #e6e0d4;box-shadow:0 10px 30px #1a2a4a33;font:12px/1.4 var(--sans);pointer-events:none;display:none}
#tip h4{margin:0 0 4px;font-size:13px;display:flex;gap:6px;align-items:center}
#tip h4 i{width:8px;height:8px;border-radius:50%}
#tip h4 small{font-weight:500;color:#6b7280}
#tip .tr{color:#6b7280} #tip .tr b{color:#2b2f3a;font-weight:500}
#tip .r{margin-top:6px;padding-top:6px;border-top:1px dashed #e6e0d4;white-space:pre-wrap;word-break:break-word}
#loader{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);z-index:4;display:flex;align-items:center;gap:10px;padding:8px 14px;font-size:12px;transition:opacity .6s}
#loader .bar{width:180px;height:8px;border-radius:2px;background:#0f1526;overflow:hidden;border:1px solid #34405f}
#loader .bar b{display:block;height:100%;width:0;background:linear-gradient(90deg,#5b9dff,#4fbf7a)}
#loader.done{opacity:0;pointer-events:none}
#hint{position:absolute;left:12px;bottom:12px;z-index:4;padding:6px 11px;font-size:12px;color:#aab4cc}
.ctl{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:6px;z-index:4;transition:right .32s cubic-bezier(.2,.8,.2,1)}
.office.lanes-open .ctl{right:calc(clamp(420px,56%,760px) + 12px)}
.office.lanes-open #loader{left:calc((100% - clamp(420px,56%,760px)) / 2)}
.ctl button{width:36px;height:36px;border-radius:9px;border:2px solid #34405f;background:#1e2740eb;box-shadow:0 3px 0 #0f1526;font:15px var(--sans);cursor:pointer;color:#eef2ff;padding:0}
.ctl button:hover{background:#2a3655}
.ctl button:active{transform:translateY(2px);box-shadow:none}
#nogl,.oempty{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:12px 18px;display:none;z-index:3;text-align:center;font-size:13px}

/* ============ 窄屏 / 矮屏：改为单列，整页滚动 ============ */
@media (max-width:1180px){body{grid-template-columns:minmax(0,1fr) 290px}#top{gap:16px}}

  body{height:auto;min-height:100vh;overflow:auto;display:flex;flex-direction:column}

}

<script>
"use strict";
/* ============================================================
   Agent Office Voxel —— 平铺开放办公区（手写 WebGL2 实例化体素，零依赖，全部程序化生成）
   一个任务（主会话）= 一间办公室：主管坐课长席，子 agent 在岛上对坐（超过 12 人再开第 2、3 个岛）；
   页面上方的任务栏（一台设备一行）负责切换办公室。
   单位：1 = 大体素（一格地板）；微体素 M = 1/8。
   每个体素 13 个 float：位置(最小角) 尺寸 颜色 出现时间 t0 自发光 em 模式 mode 高亮 hl
   mode：0 普通（em>0 时夜里透出暖色室内光） 1 自身颜色发光（灯、状态牌） 2 窗玻璃（映出天空）
   ============================================================ */
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const h = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const SRC_HEX = {app:"#e08a5f", cli:"#8f8a80", ds:"#5b9dff", qwen:"#a884ff"};
const srcHex = id => SRC_HEX[String(id || "").split("@")[0]] || "#5b9dff";
const DEV_HEX = ["#5b9dff", "#e08a5f", "#4fbf7a", "#a884ff", "#ff7aa8", "#3cc3b8", "#f0a35e", "#7aa2ff"];
const JOB_HEX = ["#ff9a3c", "#5b9dff", "#4fbf7a", "#a884ff", "#e8b84a", "#3cc3b8", "#ff7aa8", "#8cc152", "#f08a4b", "#7aa2ff"];
function hashStr(s){ let x = 2166136261; for (const ch of String(s)) x = Math.imul(x ^ ch.charCodeAt(0), 16777619); return x >>> 0 }
function hash3(a, b, c){ let x = Math.imul(a | 0, 374761393) ^ Math.imul(b | 0, 668265263) ^ Math.imul(c | 0, 1274126177); x = Math.imul(x ^ (x >>> 13), 1103515245); return (x ^ (x >>> 16)) >>> 0 }
function rng32(seed){ let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296 } }
const RGBC = new Map();
function rgbOf(hx){ let c = RGBC.get(hx); if (!c){ c = [1, 3, 5].map(i => parseInt(hx.slice(i, i + 2), 16) / 255); RGBC.set(hx, c) } return c }
const toHex = c => "#" + c.map(v => Math.round(clamp(v, 0, 1) * 255).toString(16).padStart(2, "0")).join("");
const tint = (hx, t) => toHex(rgbOf(hx).map(v => v + (1 - v) * t));
const shade = (hx, f) => toHex(rgbOf(hx).map(v => v * f));
const mixHex = (a, b, t) => { const x = rgbOf(a), y = rgbOf(b); return toHex(x.map((v, i) => lerp(v, y[i], t))) };
const toolName = t => (String(t).replace(/^mcp(?=_)/i, "").replace(/_+/g, " ").trim() || String(t)).toUpperCase();
function dur(ms){ const s = Math.max(0, Math.round(ms / 1000)); if (s < 60) return s + "s"; const m = Math.round(s / 60); if (m < 60) return m + "m"; return Math.floor(m / 60) + "h " + (m % 60) + "m" }

/* ---------------- 体素写入 ---------------- */
const STRIDE = 13;
let OUT = [], RND = Math.random, EM = 0, HL = 0;
function add(x, y, z, sx, sy, sz, hx, t0, e = EM, m = 0, j = 0){
  const c = rgbOf(hx), f = j ? 1 + (RND() * 2 - 1) * j : 1;
  OUT.push(x, y, z, sx, sy, sz, c[0] * f, c[1] * f, c[2] * f, t0, e, m, HL);
}

/* ---------------- 调色板 ---------------- */
const C = {
  marble: "#f4f0e8", marble2: "#e9e3d8", aisle: "#efeae1", aisle2: "#e5dfd3",
  wall: "#f7f3ec", wallTop: "#ffffff", frame: "#5b6573", glass: "#b9e3f7", metal: "#9aa3ad", steel: "#c9d1da",
  wood: "#c58b55", wood2: "#a8733f", deskTop: "#f8f6f1", deskLeg: "#9aa3ad", leather: "#3a3f4b",
  leaf: "#5fbf62", leaf2: "#80d87e", pot: "#e58f65", white: "#ffffff", dark: "#2b2f3a",
  screenOn: "#6fe3ff", lamp: "#fff1b8", gold: "#ffcf3f", tie: "#e5484d", suit: "#2f3b59",
  chairs: ["#5b9dff", "#ff9a3c", "#4fbf7a", "#a884ff", "#ff7aa8", "#3cc3b8"],
  books: ["#e5484d", "#5b9dff", "#ffd166", "#4fbf7a", "#a884ff", "#ff9a3c", "#3b4252"],
  skin: ["#ffe0bd", "#f7cfa4", "#e8b48a", "#c98d5f"],
  hair: ["#2b2f3a", "#5a3825", "#8b4a2b", "#e8c07a", "#d9534f", "#8e7cc3", "#3b5998", "#f2f2f2"],
  pants: ["#3b4252", "#4a5568", "#2c3e50", "#5b4636", "#33415c"],
  accent: ["#ff6b6b", "#ffd166", "#4fd17a", "#7cc7ff", "#ff9ad5"],
  cans: ["#e5484d", "#5b9dff", "#ffd166", "#4fbf7a", "#ff9f43", "#a884ff", "#3cc3b8", "#ffffff", "#2b2f3a"]
};
const ST_COL = {working: "#2fbf71", finished: "#5b9dff", failed: "#ff5a5a", stopped: "#9aa3ad", idle: "#8b7fd6", done: "#b6bec9"};
const ST_ZH = {working: "工作中", finished: "已完成", failed: "失败", stopped: "已中止", idle: "待命", done: "已结束"};

/* ---------------- 楼层布局（按真实写字楼层：侧边核心筒 + 大开间） ----------------
   左侧核心筒 x∈[0,5)：茶水间 / 男女卫生间 / 电梯厅（门禁入口）/ 楼梯间 / 机房；其右 [5,6.6) 是核心筒前通道。
   右侧大开间铺统一的拼块地毯：每个任务是一个"岛"（对向工位），沿进深方向排开，岛与岛之间是通道；
   楼层中间一条主通道；人多时上下两排岛，课长席都在靠窗一端、背对窗户。主通道另一侧放玻璃会议室、休息区、复印角。 */
const M = 1 / 8;
const CORE = 5, TX0 = 7, TW = 4, MAIN = 2;                    // 核心筒宽、首个岛的 x、每个岛占宽、主通道宽
const WALLH = 2.3, CWH = 1.2, LOWH = .45, MAXP = 6;           // 外墙高、核心筒内墙高、剖切外墙高、每岛最多 6 对桌
const bandDepth = p => 2.3 + 1.2 * Math.max(2, p) + .8;
/* 版式预设：骨架（核心筒 / 主通道 / 岛位 / 会议室休息区）共用，工位形式、主管席、名牌、材质和第三类设施不同 */
const LAYOUTS = {
  jp:     {name: "日式岛型",   carpet: ["#c6ced8", "#bec7d2"], aisle: ["#d6dce4", "#cfd6de"], wall: "#f7f3ec", brick: false, frame: "#5b6573", pillar: "#ebe7e0", desk: "jp",     boss: "jp",     sign: "hang",  third: "copy",  sofa: "#5fa8a0"},
  loft:   {name: "Loft 长桌",  planks: ["#c9955f", "#bd8a55", "#d29f68"], aisle: ["#b9b4ad", "#b1aca5"], wall: "#f2ede6", brick: true, frame: "#2b2f3a", pillar: "#3b3f46", desk: "bench", boss: "loft", sign: "neon", third: "bar", sofa: "#8b5a3c"},
  cube:   {name: "美式格子间", carpet: ["#a3adbb", "#9ba6b4"], aisle: ["#c8ced6", "#c1c8d1"], wall: "#eef0f3", brick: false, frame: "#5b6573", pillar: "#e3e6ea", desk: "cube",   boss: "glass",  sign: "plate", third: "copy",  sofa: "#5b7fa6"},
  nordic: {name: "北欧明亮",   planks: ["#ead6b4", "#e2cca6", "#efdcbc"], aisle: ["#efeeea", "#e8e6e1"], wall: "#ffffff", brick: false, frame: "#c9ced6", pillar: "#f4f2ee", desk: "nordic", boss: "nordic", sign: "wood", third: "booth", sofa: "#b8c4cc"}
};
let LY = LAYOUTS.jp;
const subSeat = s => { const k = Math.floor(s / 2), b = s % 2; return {x: b ? 2.7 : .7, y: 2.85 + 1.2 * k, dir: b ? 2 : 0, k, b} };   // 以岛（顶排朝向）左上角为原点
const DIRS = [[1, 0], [0, 1], [-1, 0], [0, -1]];
/* 以座位为原点、朝向 dir 的局部坐标绘制：u 向前（朝桌子）、v 向左右 */
function OB(cx, cy, dir, t){
  const f = DIRS[dir], s = [-f[1], f[0]];
  return (u0, u1, v0, v1, z, h, col, e = EM, m = 0, tt = t) => {
    const xs = [cx + f[0] * u0 + s[0] * v0, cx + f[0] * u1 + s[0] * v1], ys = [cy + f[1] * u0 + s[1] * v0, cy + f[1] * u1 + s[1] * v1];
    const x0 = Math.min(...xs), y0 = Math.min(...ys);
    add(x0, y0, z, Math.max(...xs) - x0, Math.max(...ys) - y0, h, col, tt, e, m);
  };
}

/* ============================================================
   静态场景
   ============================================================ */
function buildWorld(offices, opt){
  OUT = []; EM = 0; HL = 0; LY = LAYOUTS[S.layout] || LAYOUTS.jp;
  const W0 = {labels: [], zoneLabels: [], seats: new Map(), doors: [], maxT: 0, MW: 0, MD: 0, entry: [], spots: [], spotMap: new Map()};
  let X0 = 0;
  offices.forEach((off, oi) => { const r = buildOffice(off, oi, X0, opt, W0); X0 += r.W + 5; W0.MD = Math.max(W0.MD, r.D) });
  W0.MW = Math.max(1, X0 - 5);
  for (const sp of W0.spots) for (const k in sp) for (const x of sp[k]) W0.spotMap.set(x.id, x);
  W0.data = new Float32Array(OUT); W0.count = OUT.length / STRIDE; W0.maxT += .8;

/* ============================================================
   体素小人（动态实例，每帧重写）
   局部坐标：u 朝前、v 朝左右、z 朝上，单位为微体素；整体朝 +x 坐（脸朝镜头一侧）
   ============================================================ */
function lookOf(name, type, boss){
  const r = rng32(hashStr(name + "|look"));
  const pick = a => a[Math.floor(r() * a.length)];
  const k = r();
  return {skin: pick(C.skin), hair: pick(C.hair), pants: pick(C.pants), accent: pick(C.accent),
          style: k < .45 ? 0 : k < .8 ? 1 : 2,                       // 0 短发 / 1 长发 / 2 鸭舌帽
          shirt: boss ? C.suit : JOB_HEX[hashStr(type || "agent") % JOB_HEX.length]};
}
/* 工具 → 气泡图标 */
function toolIcon(tool){
  const t = String(tool || "").toLowerCase();
  if (!t) return "dots";
  if (/edit|write|notebook|patch/.test(t)) return "pencil";
  if (/read|view|cat/.test(t)) return "doc";
  if (/bash|shell|terminal|exec|run/.test(t)) return "term";
  if (/grep|glob|search|find|ls/.test(t)) return "lens";
  if (/web|fetch|browser|http|url|navigate/.test(t)) return "globe";
  if (/task|agent|todo|plan/.test(t)) return "list";
  return "gear";
}
/* 体素小人（简化版）：只用直角方块，每人约 10 块——腿、躯干、两臂、头、头发、两眼（主管多一条领带）；
   不再有倒角、腮红、嘴、耳朵、眼镜等细节，外观差异只靠肤色 / 发色 / 发型 / 衣服颜色。
   正常人比例：站高约 1.3 格（头 3 微体素），和 0.68 高的办公桌、0.35 高的沙发坐面相称。
   姿势：坐（工位 / 会议椅 / 沙发）、站（机房控制台前）、走路。 */
function personVox(P, t){
  const L = P.look, f = DIRS[P.dir], s = [-f[1], f[0]], T = P.t0;
  const bx = (u0, u1, v0, v1, a, b, hx, e = .3, m = 0) => {
    const xs = [P.x + (f[0] * u0 + s[0] * v0) * M, P.x + (f[0] * u1 + s[0] * v1) * M], ys = [P.y + (f[1] * u0 + s[1] * v0) * M, P.y + (f[1] * u1 + s[1] * v1) * M];
    const x0 = Math.min(...xs), y0 = Math.min(...ys);
    add(x0, y0, a * M, Math.max(...xs) - x0, Math.max(...ys) - y0, (b - a) * M, hx, T, e, m);
  };
  const sit = P.state === "seat", stand = P.state === "stand", rest = sit || stand, st = P.status, work = rest && st === "working";
  const wsw = rest ? 0 : Math.sin(P.walk);
  const bob = sit ? (work ? Math.max(0, Math.sin(t * 15 + P.phase)) * .12 : Math.sin(t * 1.6 + P.phase) * .08) : stand ? Math.sin(t * 1.6 + P.phase) * .05 : Math.abs(wsw) * .3;
  // 腿：坐姿 = 并拢的大腿 + 两条小腿；站 / 走 = 两条直腿（走路前后摆）
  let tb;
  if (sit){
    tb = 4;
    bx(-.6, 2.5, -1.0, 1.0, 3.3, tb, L.pants);
    bx(1.85, 2.5, -.95, -.1, 0, 3.3, L.pants); bx(1.85, 2.5, .1, .95, 0, 3.3, L.pants);
  } else {
    tb = 4.5;
    const sw = wsw * .9;
    bx(-.4 + sw, .4 + sw, -.95, -.1, 0, tb, L.pants); bx(-.4 - sw, .4 - sw, .1, .95, 0, tb, L.pants);
  }
  // 躯干（闲坐时略往后靠）；主管是深色西装 + 领带
  const lean = sit && !work ? -.25 : 0, TH = 2.9;
  bx(-.7 + lean, .7 + lean, -1.1, 1.1, tb, tb + TH, L.shirt);
  if (P.boss) bx(.7 + lean, .76 + lean, -.2, .2, tb + .6, tb + TH, C.tie);
  // 手臂：工作时双臂前伸（交替起落 = 打字 / 操作控制台），否则垂在两侧（走路时前后摆）
  if (work){
    const ph = Math.sin(t * 15 + P.phase) > 0 ? .25 : 0;
    bx(-.3 + lean, 2.2, -1.6, -1.13, tb + 1.2 + ph, tb + 1.75 + ph, L.shirt);
    bx(-.3 + lean, 2.2, 1.13, 1.6, tb + 1.45 - ph, tb + 2.0 - ph, L.shirt);
  } else {
    const sw = wsw * .8;
    bx(-.3 - sw + lean, .3 - sw + lean, -1.6, -1.13, tb + .3, tb + 2.75, L.shirt);
    bx(-.3 + sw + lean, .3 + sw + lean, 1.13, 1.6, tb + .3, tb + 2.75, L.shirt);
  }
  // 头 3×3×3 + 两眼
  const hb = tb + TH + bob, u0 = -1.3 + lean, u1 = 1.7 + lean, HW = 1.5, v = sit && !work ? Math.sin(t * 1.1 + P.phase) * .1 : 0;
  bx(u0, u1, -HW + v, HW + v, hb, hb + 3, L.skin);
  const shut = st === "idle" || st === "finished" || st === "done" || ((t * .7 + P.phase) % 4) < .13;
  for (const c of [-.65, .65]) bx(u1, u1 + .06, c - .2 + v, c + .2 + v, hb + (shut ? 1.2 : 1.0), hb + (shut ? 1.38 : 1.6), C.dark);
  // 头发：头顶一块（前沿略探出 = 刘海）+ 后脑一块（长发垂到肩）；帽子款把头顶换成彩色并加帽檐
  const HV = HW + .15, cap = L.style === 2, hc = cap ? L.accent : L.hair;
  bx(u0 - .15, u1 + .1, -HV + v, HV + v, hb + 2.1, hb + 3.3, hc);
  bx(u0 - .15, u0 + .6, -HV + v, HV + v, L.style === 1 ? hb - .5 : hb + .7, hb + 2.1, L.hair);
  if (cap) bx(u1 + .1, u1 + .6, -1.2 + v, 1.2 + v, hb + 2.1, hb + 2.3, hc);
  if (P.boss){                                                  // 主 agent：金色小王冠（底圈 + 三个尖）
    const cz = hb + 3.3, cu0 = u0 + .35, cu1 = u0 + 1.55;
    bx(cu0, cu1, -1.05 + v, 1.05 + v, cz, cz + .35, C.gold, 1, 1);
    for (const [c, hh] of [[-.8, .55], [0, .8], [.8, .55]]) bx(cu0 + .3, cu1 - .3, c - .25 + v, c + .25 + v, cz + .35, cz + .35 + hh, C.gold, 1, 1);
  }
  // 头顶气泡（坐 / 站时）：工作中 = 白气泡 + 工具图标（底部绿条）；其它状态 = 彩色气泡 + 白色符号
  if (rest){
    const pz = hb + (P.boss ? 4.9 : 4) + Math.sin(t * 2.2 + P.phase) * .2;
    const working = st === "working", bg = working ? C.white : (ST_COL[st] || "#9aa3ad"), glow = working ? .9 : .45;
    bx(-.35, .35, -1.9, 1.9, pz, pz + 3.2, bg, glow, 1);
    bx(-.25, .25, -.38, .38, pz - .45, pz, bg, glow, 1);
    if (working) bx(-.38, .38, -1.6, 1.6, pz, pz + .3, ST_COL.working, 1, 1);
    if (P.boss) bx(-.35, .35, -1.9, 1.9, pz + 3.2, pz + 3.6, C.gold, 1, 1);
    const px = (c, r, col, w = 1, hh = 1) => { const v0 = -1.5 + c * .6, z0 = pz + .45 + r * .6; bx(.36, .44, v0, v0 + .6 * w, z0, z0 + .6 * hh, col, 1, 1); bx(-.44, -.36, v0, v0 + .6 * w, z0, z0 + .6 * hh, col, 1, 1) };
    if (working){
      const ic = toolIcon(P.d && P.d.tool), DK = "#3b4252";
      if (ic === "pencil"){ px(0, 0, DK); px(1, 1, "#ffb020"); px(2, 2, "#ffb020"); px(3, 3, "#ff7aa8") }
      else if (ic === "doc"){ for (const [c, r] of [[1, 0], [1, 1], [1, 2], [1, 3], [2, 3], [3, 0], [3, 1], [3, 2], [2, 0]]) px(c, r, "#5b9dff"); px(3, 3, "#bcd6ff"); px(2, 1, "#bcd6ff"); px(2, 2, "#bcd6ff") }
      else if (ic === "term"){ px(0, 0, "#2b2f3a", 5, 4); px(1, 2, "#4fd17a"); px(2, 1, "#4fd17a"); px(1, 0, "#4fd17a"); px(3, 0, "#4fd17a") }
      else if (ic === "lens"){ for (const [c, r] of [[1, 3], [2, 3], [0, 2], [3, 2], [1, 1], [2, 1]]) px(c, r, DK); px(1, 2, "#9fd8ff"); px(2, 2, "#9fd8ff"); px(3, 0, DK); px(4, 0, DK) }
      else if (ic === "globe"){ px(1, 3, "#5b9dff", 3); px(0, 1, "#5b9dff", 5, 2); px(1, 0, "#5b9dff", 3); px(1, 2, "#4fbf7a"); px(3, 1, "#4fbf7a"); px(2, 0, "#4fbf7a") }
      else if (ic === "list"){ for (const r of [3, 1.5, 0]){ px(0, r, "#4fbf7a", 1, .75); px(1.25, r, DK, 3, .75) } }
      else if (ic === "gear"){ for (const [c, r] of [[1, 0], [2, 0], [3, 0], [1, 1], [3, 1], [1, 2], [2, 2], [3, 2], [2, 3], [0, 1], [4, 1]]) px(c, r, "#7d8593") }
      else { const k = Math.floor(t * 3 + P.phase) % 4; for (let d = 0; d < 3; d++) px(.25 + d * 1.5, 1.2, d < k ? "#2fbf71" : "#b9e8cc", 1, 1) }
    } else if (st === "finished" || st === "done"){ px(0, 1.5, C.white); px(1, .75, C.white); px(2, 1.5, C.white); px(3, 2.25, C.white); px(4, 3, C.white, 1, .75) }
    else if (st === "failed"){ px(2, 1.2, C.white, 1, 2.6); px(2, 0, C.white, 1, .8) }
    else if (st === "stopped"){ px(1, .5, C.white, 1, 3); px(3, .5, C.white, 1, 3) }
    else if (st === "idle"){ px(1, 3, C.white, 3, .7); px(2.5, 2.2, C.white, 1, .8); px(1.5, 1.4, C.white, 1, .8); px(1, .6, C.white, 3, .7) }
  }
}

/* ============================================================
   WebGL2 渲染器
   ============================================================ */
const canvas = $("gl");
const gl = canvas.getContext("webgl2", {antialias: true, alpha: true});
if (!gl){ $("nogl").style.display = "block"; throw new Error("no webgl2") }
canvas.addEventListener("webglcontextlost", e => e.preventDefault());
canvas.addEventListener("webglcontextrestored", () => location.reload());
const VS = `#version 300 es
layout(location=0) in vec3 aC; layout(location=1) in vec3 aN; layout(location=2) in vec2 aUV;
layout(location=3) in vec3 iP; layout(location=4) in vec3 iS; layout(location=5) in vec3 iCol; layout(location=6) in vec3 iX; layout(location=7) in float iH;
uniform mat4 uVP; uniform float uTime;
out vec3 vCol; out vec3 vN; out vec2 vE; out vec2 vD; out float vEm; out float vMode; out float vZ; out float vHL;
void main(){
  float t0 = iX.x;
  float s = 1.0, dz = 0.0;
  if (t0 >= 0.0){
    float p = clamp((uTime - t0) / 0.55, 0.0, 1.0);
    float e = 1.0 - (1.0 - p) * (1.0 - p) * (1.0 - p);
    float q = p - 1.0;
    float back = 1.0 + 2.70158 * q * q * q + 1.70158 * q * q;
    s = p <= 0.0 ? 0.0 : clamp(mix(0.3, 1.0, back), 0.0, 1.12);
    dz = (1.0 - e) * clamp(iS.z * 2.0 + 0.9, 0.9, 3.0);
  }
  vec3 p = iP + iS * 0.5 + (aC - 0.5) * iS * s + vec3(0.0, 0.0, dz);
  gl_Position = uVP * vec4(p, 1.0);
  float thin = min(min(iS.x, iS.y), iS.z);
  gl_Position.z -= (1.0 - smoothstep(0.004, 0.06, thin)) * 0.00015;
  vN = aN; vCol = iCol; vEm = iX.y; vMode = iX.z; vZ = p.z; vHL = iH;
  vD = abs(aN.x) > 0.5 ? iS.yz : (abs(aN.y) > 0.5 ? iS.xz : iS.xy);
  vE = aUV * vD;
}`;
const FS = `#version 300 es
precision highp float;
in vec3 vCol; in vec3 vN; in vec2 vE; in vec2 vD; in float vEm; in float vMode; in float vZ; in float vHL;
uniform vec3 uSun; uniform vec3 uSunCol; uniform vec3 uSky; uniform vec3 uGnd; uniform vec3 uWin; uniform float uNight;
out vec4 o;
void main(){
  vec3 n = normalize(vN);
  bool isWin = vMode > 1.5 && vMode < 2.5;
  vec3 base = isWin ? mix(uWin, vCol, 0.18) : vCol;
  float ndl = max(dot(n, uSun), 0.0);
  vec3 amb = mix(uGnd, uSky, n.z * 0.5 + 0.5);
  vec3 c = base * (amb + uSunCol * ndl);
  if (n.z < 0.5 && vZ > -0.35) c *= mix(0.86, 1.0, smoothstep(0.0, 0.6, vZ));
  float w = min(0.035, 0.16 * min(vD.x, vD.y));
  vec2 d = min(vE, vD - vE);
  c *= 1.0 - 0.17 * (1.0 - smoothstep(0.0, w, min(d.x, d.y)));
  if (vEm > 0.0){
    vec3 glow = isWin ? vec3(1.0, 0.86, 0.58) : (vMode > 0.5 && vMode < 1.5) ? vCol * 1.3 : vCol * vec3(1.08, 0.97, 0.82) + vec3(0.14, 0.10, 0.04);
    c = mix(c, glow, clamp(vEm * uNight, 0.0, 1.0));
  }
  c = mix(c, c * 1.12 + vec3(0.08, 0.09, 0.1), vHL * 0.9);

  const cum = [0]; for (let i = 1; i < path.length; i++) cum.push(cum[i - 1] + Math.hypot(path[i][0] - path[i - 1][0], path[i][1] - path[i - 1][1]));
  Object.assign(p, {state, path, cum, s: 0, t0: -1, next, x: path[0][0], y: path[0][1]});
}
function enter(p, target){ setPath(p, [...S.world.entry[target.oi], ...target.approach.slice(1)], "in", target) }
// 从当前位置先退回枢纽，再走向目标；target 为空表示下班离开（走回电梯）
function walkTo(p, target){
  const back = [[p.x, p.y], ...p.at.approach.slice().reverse().slice(1)];
  if (!target){ const e = (S.world.entry[p.at.oi] || []).slice().reverse(); setPath(p, [...back, ...e.slice(1)], "out", null); return }
  setPath(p, [...back, ...target.approach.slice(1)], "in", target);
}
function stepPeople(dt){
  for (const [k, p] of S.people){
    if (p.state === "seat" || p.state === "stand") continue;
    p.s += dt * 1.9; p.walk += dt * 11;
    const L = p.cum[p.cum.length - 1];
    if (p.s >= L){ if (p.state === "in" && p.next) place(p, p.next, -1); else S.people.delete(k); continue }
    let i = 1; while (i < p.cum.length - 1 && p.cum[i] < p.s) i++;
    const a = p.path[i - 1], b = p.path[i], u = (p.s - p.cum[i - 1]) / Math.max(1e-6, p.cum[i] - p.cum[i - 1]);
    p.x = lerp(a[0], b[0], u); p.y = lerp(a[1], b[1], u);
    const dx = b[0] - a[0], dy = b[1] - a[1];
    p.dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 0 : 2) : (dy > 0 ? 1 : 3);
  }
}

function dynamic(t, dt){
  OUT = []; EM = 0; HL = 0;
  stepPeople(dt);
  for (const p of S.people.values()){ HL = S.hover === p.key ? 1 : 0; personVox(p, t) }
  HL = 0;
  // 电梯门：有人在门口附近就打开
  for (const d of S.world.doors){
    let near = false;
    if (d.main) for (const p of S.people.values()) if ((p.state === "in" || p.state === "out") && Math.hypot(p.x - d.x, p.y - d.y) < 1.4) near = true;
    d.open = lerp(d.open, near ? 1 : 0, Math.min(1, dt * 6));
    const half = .6 * (1 - d.open);
    add(d.x - .02, d.y - .6, 0, .1, half, 1.82, C.steel, -1, .2); add(d.x - .02, d.y + .6 - half, 0, .1, half, 1.82, C.steel, -1, .2);
    if (half > .05){ add(d.x + .07, d.y - .6 + half - .02, .2, .02, .02, 1.4, C.metal, -1); add(d.x + .07, d.y + .6 - half, .2, .02, .02, 1.4, C.metal, -1) }
  }
  const arr = new Float32Array(OUT);
  gl.bindBuffer(gl.ARRAY_BUFFER, dynBuf); gl.bufferData(gl.ARRAY_BUFFER, arr, gl.DYNAMIC_DRAW);
  return arr.length / STRIDE;
}

function currentHour(){
  const d = new Date(Date.now() + S.skew);
  const real = d.getHours() + d.getMinutes() / 60 + d.getSeconds() / 3600;
  const target = S.hourMode !== "auto" ? +S.hourMode : S.themeMode === "light" ? 12.5 : S.themeMode === "night" ? 21.5 : real;   // “跟随”页面主题
  if (S.hourShown === null) S.hourShown = target;
  let diff = target - S.hourShown; if (diff > 12) diff -= 24; if (diff < -12) diff += 24;
  S.hourShown = (((S.hourShown + diff * .06) % 24) + 24) % 24;
  if (Math.abs(diff) < .002) S.hourShown = target;
  return S.hourShown;
}

function renderLabels(t){

  const showZ = cam.zoom >= 11, mini = cam.zoom < 60;          // 全景只显示紧凑名牌；放大后显示完整信息和设施名

}

function frame(ts){
  S.raf = 0;
  if (document.hidden || !S.world) return;
  const dt = S.lastFrame ? Math.min(.5, (ts - S.lastFrame) / 1000) : 0;   // 低帧率（后台面板）时走路也不至于停滞
  S.lastFrame = ts;
  const t = (ts - S.start) / 1000;
  if (S.tween){
    const p = clamp((ts - S.tween.t0) / S.tween.dur, 0, 1), e = p * p * (3 - 2 * p);
    for (const k of ["tx", "ty", "zoom"]) cam[k] = lerp(S.tween.a[k], S.tween.b[k], e);
    if (p >= 1) S.tween = null;
  }
  const hr = currentHour(), L = lightAt(hr);
  applySky(hr, L);
  const [pn, pic] = phaseOf(hr), hh = Math.floor(hr), mm = Math.floor((hr - hh) * 60);
  $("sceneclock").textContent = `${pic} ${pn} ${String(hh).padStart(2, "0")}:${String(mm).padStart(2, "0")}`;
  const nDyn = dynamic(t, dt);
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  gl.enable(gl.DEPTH_TEST);
  gl.useProgram(prog);
  updateVP();
  gl.uniformMatrix4fv(U.uVP, false, VP);
  gl.uniform1f(U.uTime, t);
  gl.uniform3fv(U.uSun, L.dir); gl.uniform3fv(U.uSunCol, rgbOf(L.sun).map(v => v * L.si));
  gl.uniform3fv(U.uSky, rgbOf(L.sky)); gl.uniform3fv(U.uGnd, rgbOf(L.gnd));
  gl.uniform3fv(U.uWin, rgbOf(mixHex(mixHex(L.bot, L.top, .4), "#ffffff", .25)));
  gl.uniform1f(U.uNight, L.night);
  gl.bindVertexArray(staticVAO); gl.drawElementsInstanced(gl.TRIANGLES, 36, gl.UNSIGNED_SHORT, 0, staticCount);
  if (nDyn){ gl.bindVertexArray(dynVAO); gl.drawElementsInstanced(gl.TRIANGLES, 36, gl.UNSIGNED_SHORT, 0, nDyn) }
  gl.bindVertexArray(null);
  renderLabels(t);
  const p = clamp(t / S.world.maxT, 0, 1);
  $("lbar").style.width = (p * 100).toFixed(1) + "%"; $("lpct").textContent = Math.round(p * 100) + "%";
  $("ltext").textContent = p < .5 ? "正在铺设办公区…" : p < .85 ? "正在摆放工位…" : p < 1 ? "员工入座…" : "完成";
  $("loader").classList.toggle("done", p >= 1);
  S.raf = requestAnimationFrame(frame);
}
function schedule(){ if (!S.raf) S.raf = requestAnimationFrame(frame) }
document.addEventListener("visibilitychange", () => { S.lastFrame = 0; schedule() });

/* 数据更新（页面轮询调用）：结构变了就重建静态场景（铺设动画进行中则继续动画），再同步人员；replay = 重新铺设 */
function sceneUpdate(d, replay){
  S.skew = d.now - Date.now(); S.data = d;
  if (replay){ sceneReplay(); return }
  const offices = officesFrom(d), sig = staticSig(offices);
  const animating = (performance.now() - S.start) / 1000 < S.animEnd;
  if (sig !== S.sig){ S.sig = sig; build(offices, animating) }
  syncPeople(offices, animating);
  const zs = offices.flatMap(o => o.zones);
  for (const [e, Z] of S.zoneEls){ if (Z.amen) continue; const z = zs.find(x => x.key === Z.Z.key); if (z){ Z.Z = z; e.innerHTML = zoneLabelHTML(Z) } }
  $("oempty").style.display = zs.length ? "none" : "block";
}
/* 重新铺设：首次加载、切换任务、换版式、点 ↻ */
function sceneReplay(){
  if (!S.data) return;
  const offices = officesFrom(S.data);
  S.sig = staticSig(offices); S.start = performance.now(); S.autoFit = true; S.tween = null;
  build(offices, true); S.animEnd = S.world.maxT; S.people.clear(); syncPeople(offices, true); schedule();
  $("oempty").style.display = offices[0].zones.length ? "none" : "block";
}

/* ---------------- 交互：悬停小人看详情 / 点分区牌聚焦 / 拖动 / 缩放 ---------------- */
function pickPerson(sx, sy){
  const O = rayAt(sx, sy), Dr = DV.map(v => -v);
  let best = null, bt = Infinity;
  for (const p of S.people.values()){
    const lo = [p.x - .35, p.y - .35, 0], hi = [p.x + .35, p.y + .35, p.state === "seat" || p.state === "stand" ? 2.3 : 1.6];
    let t0 = -Infinity, t1 = Infinity;
    for (let i = 0; i < 3; i++){ const a = (lo[i] - O[i]) / Dr[i], c = (hi[i] - O[i]) / Dr[i]; t0 = Math.max(t0, Math.min(a, c)); t1 = Math.min(t1, Math.max(a, c)) }
    if (t1 >= t0 && t0 < bt){ bt = t0; best = p }
  }
  return best;
}
const tip = $("tip");
function hideTip(){ tip.style.display = "none" }
function showTip(p, sx, sy){
  const d = p.d || {}, now = S.data ? S.data.now : Date.now(), row = (k, v) => v ? `<div class="tr">${k}：<b>${h(v)}</b></div>` : "";
  const walking = p.state === "in" ? "（正在走过去）" : p.state === "out" ? "（正在离开）" : "";
  tip.innerHTML = `<h4><i style="background:${ST_COL[p.status] || "#9aa3ad"}"></i>${p.boss ? "★ " : ""}${h(p.name)} <small>${p.boss ? "主 agent" : h(d.type || "子 agent")} · ${h(ST_ZH[p.status] || p.status)}${walking}</small></h4>`
    + row(p.boss ? "任务" : "子任务", p.boss ? p.z.title : d.task) + (p.boss ? "" : row("所属任务", p.z.title))
    + row("位置", p.state === "in" || p.state === "out" ? "" : PLACE_ZH[p.at && p.at.kind] || (p.boss ? "在课长席" : "在工位")) + row("档位", p.z.src) + row("模型", d.model) + row("工具", p.status === "working" && d.tool ? toolName(d.tool) : "")
    + (d.start && d.last ? row("用时", dur(d.last - d.start) + (p.status === "working" ? "" : " · " + dur(now - d.last) + " 前")) : "")
    + (d.reply ? `<div class="r">${h(d.reply)}</div>` : "");
  tip.style.display = "block";
  const r = tip.getBoundingClientRect();
  let x = sx + 16, y = sy + 16;
  if (x + r.width > innerWidth - 8) x = sx - r.width - 16;
  if (y + r.height > innerHeight - 8) y = Math.max(8, sy - r.height - 16);
  tip.style.left = x + "px"; tip.style.top = y + "px";
}
const loc = e => { const r = canvas.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top] };   // 画布内坐标
let onPersonClick = null;                                     // 页面层挂钩：点小人时在排班里定位
function hoverAt(e){
  const [x, y] = loc(e), p = pickPerson(x, y);
  S.hover = p ? p.key : null;
  canvas.classList.toggle("pick", !!p);
  if (p) showTip(p, e.clientX, e.clientY); else hideTip();
}
const ptrs = new Map(); let pinch = null, dragG = null;
canvas.addEventListener("pointerdown", e => {
  canvas.setPointerCapture(e.pointerId); const q = loc(e); ptrs.set(e.pointerId, q);
  if (ptrs.size === 1){ dragG = ground(...q); S.down = {x: q[0], y: q[1], moved: false} }
  if (ptrs.size === 2){ const [a, b] = [...ptrs.values()]; pinch = {d: Math.hypot(a[0] - b[0], a[1] - b[1]), m: [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2]}; dragG = null }
});
canvas.addEventListener("pointermove", e => {
  if (!ptrs.has(e.pointerId)){ hoverAt(e); return }
  const q = loc(e); ptrs.set(e.pointerId, q);
  if (S.down && !S.down.moved){
    if (ptrs.size === 1 && Math.hypot(q[0] - S.down.x, q[1] - S.down.y) <= 5) return;
    S.down.moved = true; canvas.classList.add("drag"); hideTip(); S.tween = null;
  }
  if (ptrs.size === 2 && pinch){
    const [a, b] = [...ptrs.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]), m = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
    const g0 = ground(...pinch.m); zoomBy(d / pinch.d, m[0], m[1]); const g1 = ground(...m);
    cam.tx += g0[0] - g1[0]; cam.ty += g0[1] - g1[1]; pinch = {d, m};
  } else if (dragG){ const g = ground(...q); cam.tx += dragG[0] - g[0]; cam.ty += dragG[1] - g[1] }
  S.autoFit = false;
});
const endPtr = e => {
  if (e.type === "pointerup" && ptrs.size === 1 && S.down && !S.down.moved){
    const p = pickPerson(...loc(e));
    if (p){ S.hover = p.key; showTip(p, e.clientX, e.clientY); if (onPersonClick) onPersonClick(p) } else { S.hover = null; hideTip() }
  }
  if (ptrs.size <= 1) S.down = null;
  ptrs.delete(e.pointerId); if (ptrs.size < 2) pinch = null;
  if (!ptrs.size){ dragG = null; canvas.classList.remove("drag") } else if (ptrs.size === 1){ const [p] = [...ptrs.values()]; dragG = ground(...p) }
};
canvas.addEventListener("pointerup", endPtr); canvas.addEventListener("pointercancel", endPtr);
canvas.addEventListener("pointerleave", () => { if (!ptrs.size){ S.hover = null; hideTip(); canvas.classList.remove("pick") } });
function zoomBy(f, sx, sy){
  S.tween = null;
  const g0 = ground(sx, sy); cam.zoom = clamp(cam.zoom * f, 4, 90); const g1 = ground(sx, sy);
  cam.tx += g0[0] - g1[0]; cam.ty += g0[1] - g1[1]; S.autoFit = false;
}
// 普通滚轮不缩放（留给网页上下滚动）；只接管触控板双指捏合（浏览器以 ctrlKey + wheel 上报），否则会缩放整页
canvas.addEventListener("wheel", e => { if (!e.ctrlKey) return; e.preventDefault(); zoomBy(Math.exp(-e.deltaY * .01), ...loc(e)) }, {passive: false});
$("zin").onclick = () => zoomBy(1.25, viewCx(), cssH / 2);
$("zout").onclick = () => zoomBy(.8, viewCx(), cssH / 2);
$("zfit").onclick = () => { S.autoFit = true; S.tween = null; fit() };
$("lay").innerHTML = Object.entries(LAYOUTS).map(([k, v]) => `<option value="${k}"${k === S.layout ? " selected" : ""}>🏢 ${v.name}</option>`).join("");
$("lay").onchange = e => { S.layout = e.target.value; try { localStorage.setItem("office.layout", S.layout) } catch {} $("replay").onclick() };
$("replay").onclick = () => sceneReplay();
$("timebar").addEventListener("click", e => {
  const b = e.target.closest("button[data-h]"); if (!b) return;
  S.hourMode = b.dataset.h; for (const x of $("timebar").querySelectorAll("button")) x.classList.toggle("on", x === b);
});
$("labels").addEventListener("click", e => {
  const el = e.target.closest(".zl.vis"); if (!el) return;
  const Z = S.zoneEls.find(([x]) => x === el)?.[1]; if (!Z) return;
  S.tween = {a: {...cam}, b: camTarget(Z.cx, Z.cy, .6, Math.max(cam.zoom, 64), .05), t0: performance.now(), dur: 650}; S.autoFit = false;
});
const officeRO = new ResizeObserver(() => resize()); officeRO.observe($("office"));
var SCENE_OK = true;                                         // 页面层据此判断体素场景可用

<script>

const Deck = (() => {
const $ = id => document.getElementById(id);

/* ---------- 增量更新：把新 HTML 与现有 DOM 对比，只改有变化的文字/属性，元素尽量复用

function patch(el, html){

function sameKind(a,b){
  if(a.nodeType!==b.nodeType||a.nodeName!==b.nodeName) return false;

}
function morphChildren(oldP, newP, animate){
  const keyed=new Map();
  for(const c of oldP.childNodes) if(c.nodeType===1&&c.hasAttribute("data-key")) keyed.set(c.getAttribute("data-key"),c);
  let ref=oldP.firstChild;
  for(const n of [...newP.childNodes]){
    let m=null;
    const k=n.nodeType===1?n.getAttribute("data-key"):null;
    if(k!==null){ m=keyed.get(k)||null; if(m&&m.nodeName!==n.nodeName) m=null; if(m) keyed.delete(k); }
    else if(ref&&sameKind(ref,n)) m=ref;
    if(m){ if(m===ref) ref=ref.nextSibling; else oldP.insertBefore(m, ref); morph(m,n,animate); }
    else { oldP.insertBefore(n, ref); if(animate&&k!==null) n.classList.add("enter"); }
  }

function morph(a,b,animate){
  if(a.nodeType===3||a.nodeType===8){ if(a.nodeValue!==b.nodeValue) a.nodeValue=b.nodeValue; return; }
  for(const at of [...a.attributes]) if(!b.hasAttribute(at.name)) a.removeAttribute(at.name);
  for(const at of b.attributes) if(a.getAttribute(at.name)!==at.value) a.setAttribute(at.name, at.value);
  morphChildren(a,b,animate);
}

function darken(c){return "#"+[1,3,5].map(i=>Math.round(parseInt(c.slice(i,i+2),16)*.68).toString(16).padStart(2,"0")).join("")}

function hm(t,sec){const d=new Date(t);const p=n=>String(n).padStart(2,"0");return p(d.getHours())+":"+p(d.getMinutes())+(sec?":"+p(d.getSeconds()):"")}
