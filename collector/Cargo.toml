[package]
name = "deck-push"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
description = "Agent Deck 推送采集器：只读扫描本机 Claude Code 各档位目录，定时推送到 hub"
publish = false

[[bin]]
name = "deck-push"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 只用 rustls（tls 特性），不引入 native-tls
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
sha1_smol = "1"
libc = "0.2"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
