# Agent Deck 反代示例（宿主机 nginx，host 网络）。部署时把 server_name 换成你的域名，
# 证书与通用反代参数按你自己的 nginx 约定 include。
server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name agent-deck.example.com;
    include /etc/nginx/snippets/tls.conf;
    access_log /var/log/nginx/agent-deck-access.jsonl access_json;
    error_log /var/log/nginx/agent-deck-error.log warn;
    client_max_body_size 64k;

    # 推送接口：无密钥，只允许内网直连写入
    location = /api/ingest {
        client_max_body_size 1m;         # 与服务端 MAX_INGEST 一致
        # 经反向隧道/代理转进来的请求会带 X-Forwarded-For，一律拒绝，防止伪造内网来源
        if ($http_x_forwarded_for) { return 403; }
        allow 127.0.0.1;
        allow 192.168.0.0/16;            # 按你的内网网段收窄；不要放行 docker 网桥网段
        deny all;
        access_log off;                  # 每台设备每 3 秒一次，不记访问日志
        proxy_pass http://127.0.0.1:7788;
        include /etc/nginx/snippets/proxy.conf;
    }

    location = /api/state {
        access_log off;                  # 页面每 3 秒轮询一次
        limit_except GET HEAD { deny all; }
        proxy_pass http://127.0.0.1:7788;
        include /etc/nginx/snippets/proxy.conf;
    }

    location / {
        limit_except GET HEAD { deny all; }
        proxy_pass http://127.0.0.1:7788;
        include /etc/nginx/snippets/proxy.conf;
    }
}
