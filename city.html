<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agent City</title>
<style>
:root{--ink:#2b2f3a;--muted:#6b7280;--card:#ffffffd9;--line:#e6e0d4}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;color:var(--ink);
  font:13px/1.4 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  background:linear-gradient(180deg,#74c0ff 0%,#def2ff 100%)}
#sky{position:fixed;inset:0;z-index:0;pointer-events:none}
#stars{position:fixed;inset:0 0 35% 0;z-index:0;pointer-events:none;opacity:0}
#stars i{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;animation:tw 3s ease-in-out infinite}
@keyframes tw{50%{opacity:.25}}
.orb{position:fixed;z-index:0;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;pointer-events:none}
#sun{background:radial-gradient(circle,#fffbe6 0 45%,#ffe58a 46% 60%,#ffd34d00 72%);filter:drop-shadow(0 0 22px #ffe28a)}
#moon{width:40px;height:40px;margin:-20px 0 0 -20px;background:radial-gradient(circle at 35% 35%,#ffffff,#dfe6ff 60%,#c4cdea);box-shadow:0 0 24px #c9d6ff99}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;z-index:1}
#gl.drag{cursor:grabbing}
header{position:fixed;left:16px;right:16px;top:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;pointer-events:none;z-index:4}
header>*{pointer-events:auto}
.pill{background:var(--card);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid #fff;border-radius:14px;box-shadow:0 4px 14px #1a2a4a22}
.brand{display:flex;align-items:center;gap:8px;padding:7px 12px;font-weight:700}
.brand .dot{width:8px;height:8px;border-radius:50%;background:#2f9e6f;box-shadow:0 0 0 3px #2f9e6f33}
.brand.off .dot{background:#e5484d;box-shadow:0 0 0 3px #e5484d33}
.brand .host{font-weight:500;color:var(--muted)}
.brand a{font-weight:500;color:var(--muted);text-decoration:none;font-size:12px;border-left:1px solid var(--line);padding-left:10px}
.brand a:hover{color:var(--ink)}
.stats{display:flex;align-items:center;gap:12px;padding:6px 12px;font-size:12px;color:var(--muted)}
.stats b{color:var(--ink);font-size:15px;margin-right:2px}
.stats i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.time{display:flex;align-items:center;gap:4px;padding:4px 5px 4px 11px;font-size:12px}
.time b{font-size:13px;margin-right:6px;min-width:92px}
.time button{border:0;background:transparent;font:inherit;font-size:12px;padding:4px 8px;border-radius:9px;cursor:pointer;color:var(--muted)}
.time button.on{background:#2b2f3a;color:#fff}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:2}
.bl{position:absolute;left:0;top:0;transform:translate(-50%,-100%);display:flex;align-items:center;gap:6px;padding:4px 10px;border-radius:10px;
  background:#fff;font-size:12px;font-weight:700;white-space:nowrap;box-shadow:0 4px 12px #1a2a4a30;opacity:0;transition:opacity .5s}
.bl i{width:8px;height:8px;border-radius:50%}
.bl small{font-weight:500;color:var(--muted)}
.fl{position:absolute;left:0;top:0;transform:translate(-100%,-50%);display:flex;align-items:center;gap:5px;padding:2px 7px;border-radius:7px;
  background:#ffffffe6;font-size:10.5px;white-space:nowrap;max-width:190px;overflow:hidden;text-overflow:ellipsis;box-shadow:0 2px 8px #1a2a4a26;opacity:0;transition:opacity .4s}
.fl b{font-weight:700}
.fl i{flex:none;width:7px;height:7px;border-radius:50%}
.on{opacity:1!important}
#loader{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:4;display:flex;align-items:center;gap:10px;padding:8px 14px;font-size:12px;transition:opacity .6s}
#loader .bar{width:180px;height:6px;border-radius:3px;background:#e5e7eb;overflow:hidden}
#loader .bar b{display:block;height:100%;width:0;background:linear-gradient(90deg,#5b9dff,#4fbf7a)}
#loader.done{opacity:0;pointer-events:none}
.ctl{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:6px;z-index:4}
.ctl button{width:36px;height:36px;border-radius:11px;border:1px solid #fff;background:var(--card);box-shadow:0 4px 12px #1a2a4a26;font:inherit;font-size:15px;cursor:pointer;color:var(--ink)}
.ctl button:hover{background:#fff}
.ic{display:inline-block;width:.9em;height:.9em;vertical-align:-.1em;flex:none;overflow:visible}   /* SVG 图标：盒子中心落在大写字母/汉字的视觉中线上 */
.ctl button{display:grid;place-items:center;padding:0}
.ctl button .ic{width:16px;height:16px}
#tip{position:fixed;z-index:5;max-width:300px;padding:9px 12px;border-radius:12px;background:#fffffff5;border:1px solid var(--line);box-shadow:0 10px 30px #1a2a4a33;font-size:12px;pointer-events:none;display:none}
#tip h4{margin:0 0 4px;font-size:13px;display:flex;gap:6px;align-items:center}
#tip h4 i{width:8px;height:8px;border-radius:50%}
#tip .row{color:var(--muted)} #tip .row b{color:var(--ink);font-weight:500}
#tip .hint{margin-top:6px;padding-top:6px;border-top:1px dashed var(--line);color:var(--muted)}
#hint{position:fixed;left:16px;bottom:16px;z-index:4;padding:6px 11px;font-size:12px;color:var(--muted)}
.fl.on{pointer-events:auto;cursor:pointer}
.fl.cur{background:#2b2f3a;color:#fff}
#gl.pick{cursor:pointer}
#nogl{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);padding:14px 18px;display:none;z-index:5;text-align:center}
@media (max-width:640px){.time b{min-width:0}.fl{display:none}}
</style>
</head>
<body>
<div id="sky"></div>
<div id="stars"></div>
<div class="orb" id="sun"></div>
<div class="orb" id="moon"></div>
<canvas id="gl"></canvas>
<div id="labels"></div>
<header>
  <div class="pill brand" id="brand"><span class="dot"></span>Agent City <span class="host" id="host"></span><a href="/office">办公室视图</a><a href="/">泳道视图</a></div>
  <div class="pill stats" id="stats"></div>
  <div class="pill time" id="timebar"><b id="clock">—</b>
    <button data-h="auto" class="on">自动</button><button data-h="8">早上</button><button data-h="13">中午</button><button data-h="17.9">黄昏</button><button data-h="21.5">夜晚</button>
  </div>
</header>
<div class="pill" id="loader"><span id="ltext">正在铺设道路…</span><div class="bar"><b id="lbar"></b></div><span id="lpct">0%</span></div>
<div class="ctl">
  <button id="replay" title="重新铺设"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M13 8a5 5 0 1 1-1.46-3.54"/><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M11.8 1.6v3.1H8.7"/></svg></button>
  <button id="zin" title="放大"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M8 3v10M3 8h10"/></svg></button>
  <button id="zout" title="缩小"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M3 8h10"/></svg></button>
  <button id="zfit" title="适配全部"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M9.5 2.5h4v4M13.5 2.5L9.3 6.7M6.5 13.5h-4v-4M2.5 13.5l4.2-4.2"/></svg></button>
</div>
<div id="tip"></div>
<div class="pill" id="hint">点击楼层剖开查看 · Esc 收起 · 拖动平移 · 滚轮缩放</div>
<div class="pill" id="nogl">当前浏览器不支持 WebGL2，无法显示体素城市。</div>

<script>
"use strict";
/* ============================================================
   Agent City —— 手写 WebGL2 实例化体素渲染（零依赖，全部程序化生成）
   单位：1 = 大体素（一格地块）；微体素 M = 1/8。
   每个体素 12 个 float：位置(最小角 xyz) 尺寸(xyz) 颜色(rgb) 出现时间 t0 自发光 em 模式 mode
   mode：0 普通（em>0 时夜里透出暖色室内光） 1 自身颜色发光（灯、屏幕） 2 窗玻璃（映出天空）
         3 云（em 存漂移种子） 4 闪烁信号灯
   ============================================================ */
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const h = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const SRC_HEX = {app:"#e08a5f", cli:"#8f8a80", ds:"#5b9dff", qwen:"#a884ff"};
const srcHex = id => SRC_HEX[String(id || "").split("@")[0]] || "#5b9dff";
function hashStr(s){ let x = 2166136261; for (const ch of String(s)) x = Math.imul(x ^ ch.charCodeAt(0), 16777619); return x >>> 0 }
function hash3(a, b, c){ let x = Math.imul(a | 0, 374761393) ^ Math.imul(b | 0, 668265263) ^ Math.imul(c | 0, 1274126177); x = Math.imul(x ^ (x >>> 13), 1103515245); return (x ^ (x >>> 16)) >>> 0 }
function rng32(seed){ let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296 } }
const RGBC = new Map();
function rgbOf(hx){ let c = RGBC.get(hx); if (!c){ c = [1, 3, 5].map(i => parseInt(hx.slice(i, i + 2), 16) / 255); RGBC.set(hx, c) } return c }
const toHex = c => "#" + c.map(v => Math.round(clamp(v, 0, 1) * 255).toString(16).padStart(2, "0")).join("");
const tint = (hx, t) => toHex(rgbOf(hx).map(v => v + (1 - v) * t));
const shade = (hx, f) => toHex(rgbOf(hx).map(v => v * f));
const mixHex = (a, b, t) => { const x = rgbOf(a), y = rgbOf(b); return toHex(x.map((v, i) => lerp(v, y[i], t))) };

/* ---------------- 体素写入 ---------------- */
/* TAG：楼宇体素的归属 = 楼号×1000 + 层号×10 + 是否外立面(1)；-1 表示不属于楼宇。
   层号 0 = 大堂，1..n = 任务楼层，n+1 = 楼顶。选中某层时，层号更大的整体抬起，本层外立面收起。 */
let OUT = [], RND = Math.random, EM = 0, TAG = -1;
const STRIDE = 13;
function add(x, y, z, sx, sy, sz, hx, t0, e = EM, m = 0, j = 0){
  const c = rgbOf(hx), f = j ? 1 + (RND() * 2 - 1) * j : 1;
  OUT.push(x, y, z, sx, sy, sz, c[0] * f, c[1] * f, c[2] * f, t0, e, m, TAG);
}

/* ---------------- 调色板 ---------------- */
const C = {
  road: "#656c79", road2: "#5f6673", paint: "#f8f6ef", yellow: "#ffd166", manhole: "#4a505b",
  walk: "#f1ebe0", walk2: "#e6dfd0",
  grass: "#94d66f", grass2: "#89cd65", dirt: "#b08356", stone: "#8f949c",
  water: "#62bff0", water2: "#7fd0f7", lily: "#5fbf62",
  plaza: "#efe2cf", plaza2: "#e4d3bc", path: "#f8f0e3", concrete: "#d9dde2",
  trunk: "#9b6b43", leaf: "#5fbf62", leaf2: "#80d87e", leaf3: "#4aa856", hedge: "#4fae57", apple: "#ff6b6b",
  pole: "#4b5563", metal: "#9aa3ad", lamp: "#fff1b8", cone: "#ff8a3d", white: "#ffffff",
  wall: "#f7f3ec", pier: "#f4f1ec", frame: "#5b6573", glass: "#b9e3f7", rail: "#cdeef8",
  wood: "#c58b55", wood2: "#a8733f", floorWood: "#ecd2ad", floorWood2: "#e2c69f", deskTop: "#f8f6f1",
  chairs: ["#5b9dff", "#ff9a3c", "#4fbf7a", "#a884ff", "#ff7aa8", "#3cc3b8"],
  screenOff: "#323b4a", screenOn: "#6fe3ff", gravel: "#c9cdd3", gravel2: "#bec3ca", solar: "#2c4d80",
  flower: ["#ff8fab", "#ffd166", "#ffffff", "#b388ff", "#7cc7ff"], tuft: "#6fbf4f", rock: "#a3a8b0",
  bench: "#b5794a", bin: "#5b7d5e", hydrant: "#e5484d", books: ["#e5484d", "#5b9dff", "#ffd166", "#4fbf7a", "#a884ff", "#ff9a3c", "#3b4252"],
  cars: ["#ff6b6b", "#5b9dff", "#ffd166", "#4fbf7a", "#ffffff", "#a884ff", "#ff9a3c", "#3cc3b8"]
};

/* ---------------- 城市布局常量 ---------------- */
const M = 1 / 8;
const T = {GRASS: 0, ROAD_H: 1, ROAD_V: 2, CROSS: 3, WALK: 4, PLOT: 5, PARK: 6, WATER: 7};
const PW = 12, PD = 10, WALK = 2, ROAD = 4, MARGIN = 6;     // 地块 12×10，人行道 2，马路 4，外圈草地 6
const CW = PW + 2 * WALK, CD = PD + 2 * WALK, PX = CW + ROAD, PY = CD + ROAD;
const TOP = [0, 0, 0, 0, M, 2 * M, 0, -M];                  // 各类地块顶面高度
const COST = [3.4, 1, 1, 1, 2.4, 2.8, 3.4, 3.4];            // 铺设扩散代价：马路最便宜 → 先沿路网铺开
const BW = 7, BD = 7, LH = 2.25, FH = 2.0, ST = .25, RISE = .12;   // 楼体 7×7，大堂层高 2.25，标准层高 2，楼板厚 .25
const DIRS = [[1, 0], [0, 1], [-1, 0], [0, -1]];

/* ============================================================
   场景生成
   ============================================================ */
function buildCity(groups, opt){
  OUT = []; TAG = -1;
  const n = Math.max(1, groups.length);
  const cols = Math.ceil(Math.sqrt(n)), rows = Math.ceil(n / cols);
  const W = ROAD + cols * PX, D = ROAD + rows * PY;
  const MW = W + 2 * MARGIN, MD = D + 2 * MARGIN, N = MW * MD;
  const type = new Uint8Array(N), zone = new Uint8Array(N);   // zone：地块内分区（广场/草坪/楼基/电梯基座）
  const cellOf = (x, y) => Math.floor(y / PY) * cols + Math.floor(x / PX);
  for (let j = 0; j < MD; j++) for (let i = 0; i < MW; i++){
    const x = i - MARGIN, y = j - MARGIN, k = j * MW + i;
    if (x < 0 || y < 0 || x >= W || y >= D){ type[k] = T.GRASS; continue }
    const ux = x % PX, uy = y % PY, rx = ux < ROAD, ry = uy < ROAD;
    if (rx && ry) type[k] = T.CROSS;
    else if (rx) type[k] = T.ROAD_V;
    else if (ry) type[k] = T.ROAD_H;
    else {
      const cx = ux - ROAD, cy = uy - ROAD, lx = cx - WALK, ly = cy - WALK;
      if (cx < WALK || cx >= CW - WALK || cy < WALK || cy >= CD - WALK) type[k] = T.WALK;
      else if (cellOf(x, y) < groups.length){
        type[k] = T.PLOT;
        zone[k] = lx >= 8 ? 1 : ly >= 8 ? (lx >= 2 && lx < 4 ? 4 : 2) : (lx === 0 || ly === 0) ? 2 : 3;
      } else type[k] = (lx >= 3 && lx <= 8 && ly >= 3 && ly <= 6) ? T.WATER : T.PARK;
    }
  }
  const inb = (a, b) => a >= 0 && b >= 0 && a < MW && b < MD;
  const isRoad = k => type[k] >= T.ROAD_H && type[k] <= T.CROSS;

  // ---- 铺设顺序：从城市左角路口做 Dijkstra
  const dist = new Float64Array(N).fill(1e9), heap = [];      // 必须用 64 位：32 位舍入会让出堆比较误判、扩散中断
  const hpush = (d, k) => { heap.push([d, k]); let i = heap.length - 1; while (i > 0){ const p = (i - 1) >> 1; if (heap[p][0] <= heap[i][0]) break; [heap[p], heap[i]] = [heap[i], heap[p]]; i = p } };
  const hpop = () => { const top = heap[0], last = heap.pop(); if (heap.length){ heap[0] = last; let i = 0; for (;;){ const l = 2 * i + 1, r = l + 1; let m = i; if (l < heap.length && heap[l][0] < heap[m][0]) m = l; if (r < heap.length && heap[r][0] < heap[m][0]) m = r; if (m === i) break; [heap[m], heap[i]] = [heap[i], heap[m]]; i = m } } return top };
  const o = (MARGIN + 1) * MW + (MARGIN + W - 2);
  dist[o] = 0; hpush(0, o);
  while (heap.length){
    const [d, k] = hpop(); if (d > dist[k]) continue;
    const i = k % MW, j = (k - i) / MW;
    for (const [di, dj] of DIRS){ const a = i + di, b = j + dj; if (!inb(a, b)) continue; const q = b * MW + a, nd = d + COST[type[q]]; if (nd < dist[q]){ dist[q] = nd; hpush(nd, q) } }
  }
  const instant = !opt.animate;
  const tileT = (k, r) => instant ? -1 : .35 + dist[k] * .03 + r * .05;
  let maxT = 0;

  // ---- 立体沙盘底座：土层 + 石层，侧面嵌几块石头
  EM = 0; RND = rng32(99);
  add(0, 0, -2.2, MW, MD, 1.95, C.dirt, -1);
  add(0, 0, -3.0, MW, MD, .8, C.stone, -1);
  for (let s = 0; s < 60; s++){
    const onX = s & 1, a = RND() * (onX ? MD : MW), z = -2.9 + RND() * 2.4, w = M * (1 + Math.floor(RND() * 3));
    if (onX) add(MW, a, z, M, w, w, RND() < .5 ? C.stone : "#7e848d", -1); else add(a, MD, z, w, M, w, RND() < .5 ? C.stone : "#7e848d", -1);
  }

  // ---- 地块与街道细节
  const trees = new Set();
  for (let j = 0; j < MD; j++) for (let i = 0; i < MW; i++){
    const k = j * MW + i, ty = type[k], top = TOP[ty], chk = (i + j) & 1;
    RND = rng32(hash3(i, j, 7));
    const t = tileT(k, RND()); maxT = Math.max(maxT, t);
    const x = i - MARGIN, y = j - MARGIN, ux = ((x % PX) + PX) % PX, uy = ((y % PY) + PY) % PY;
    let col;
    if (ty === T.GRASS || ty === T.PARK) col = chk ? C.grass : C.grass2;
    else if (ty === T.WATER) col = chk ? C.water : C.water2;
    else if (ty === T.WALK) col = chk ? C.walk : C.walk2;
    else if (ty === T.PLOT){
      const zn = zone[k], ly = uy - ROAD - WALK;
      col = zn === 1 ? ((ly === 4 || ly === 5) ? C.path : (chk ? C.plaza : C.plaza2)) : zn === 2 ? (chk ? C.grass : C.grass2) : C.concrete;
    } else col = RND() < .5 ? C.road : C.road2;
    add(i, j, -.25, 1, 1, .25 + top, col, t, 0, 0, .025);

    if (ty === T.ROAD_H){
      if (ux === ROAD || ux === PX - 1){ add(i + .1, j + .12, 0, .8, .26, .02, C.paint, t + .12); add(i + .1, j + .62, 0, .8, .26, .02, C.paint, t + .14) }
      else if (uy === 1 && ux % 2 === 0) add(i + .15, j + 1 - .06, 0, .7, .12, .02, C.yellow, t + .15);
      else if (RND() < .02) add(i + .3, j + .3, 0, .4, .4, .02, C.manhole, t + .1);
    } else if (ty === T.ROAD_V){
      if (uy === ROAD || uy === PY - 1){ add(i + .12, j + .1, 0, .26, .8, .02, C.paint, t + .12); add(i + .62, j + .1, 0, .26, .8, .02, C.paint, t + .14) }
      else if (ux === 1 && uy % 2 === 0) add(i + 1 - .06, j + .15, 0, .12, .7, .02, C.yellow, t + .15);
      else if (RND() < .02) add(i + .3, j + .3, 0, .4, .4, .02, C.manhole, t + .1);
    } else if (ty === T.WALK){
      let rd = null, corner = false;
      for (const [di, dj] of DIRS){ const a = i + di, b = j + dj; if (inb(a, b) && isRoad(b * MW + a)){ rd = rd || [di, dj] } }
      for (const [di, dj] of [[1,1],[1,-1],[-1,1],[-1,-1]]){ const a = i + di, b = j + dj; if (inb(a, b) && type[b * MW + a] === T.CROSS && isRoad(j * MW + a) && isRoad(b * MW + i)) corner = true }
      if (corner) trafficLight(i, j, top, t + .3);
      else if (rd && (i + 2 * j) % 7 === 0) lamp(i, j, top, rd, t + .3);
      else if (rd){
        const v = RND();
        if (v < .1) planterTree(i, j, top, t + .3);
        else if (v < .15) bench(i, j, top, rd, t + .3);
        else if (v < .18) add(i + .4, j + .4, top, .22, .22, .32, C.bin, t + .3);

function loopPos(loop, s){
  let L = 0; const seg = [];

  s = ((s % L) + L) % L;

function dynamic(t, dt){

  const showFloors = cam.zoom >= 15;
  for (const [e, L2] of S.labelEls){ const [x, y] = project(L2.x, L2.y, L2.z + liftOf(L2.b, 99)); e.style.transform = `translate(${x.toFixed(1)}px,${y.toFixed(1)}px) translate(-50%,-100%)`; e.classList.toggle("on", t > L2.t || L2.t < 0) }
  for (const [e, F] of S.floorEls){ const [x, y] = project(F.x, F.y, F.z + liftOf(F.b, F.f)); e.classList.toggle("cur", !!(S.selWant && S.selWant.b === F.b && S.selWant.f === F.f)); e.style.transform = `translate(${x.toFixed(1)}px,${y.toFixed(1)}px) translate(-100%,-50%)`; e.classList.toggle("on", showFloors && (t > F.t + .5 || F.t < 0)) }

  // 加载进度
  const p = clamp(t / S.city.maxT, 0, 1);
  $("lbar").style.width = (p * 100).toFixed(1) + "%"; $("lpct").textContent = Math.round(p * 100) + "%";
  $("ltext").textContent = p < .45 ? "正在铺设道路…" : p < .99 ? "正在建造大楼…" : "完成";
  $("loader").classList.toggle("done", p >= 1);
  schedule();
}
function schedule(){ if (!S.raf) S.raf = requestAnimationFrame(frame) }
document.addEventListener("visibilitychange", () => { S.lastFrame = 0; schedule() });

async function poll(first){
  let d = null;
  try { const r = await fetch("/api/state", {cache: "no-store"}); if (!r.ok) throw 0; d = await r.json(); $("brand").classList.remove("off") }
  catch { $("brand").classList.add("off") }
  if (d){ S.skew = d.now - Date.now(); S.data = d; $("host").textContent = d.host ? "· " + d.host : "" }
  let groups = d ? groupsFrom(d) : [];
  if (!groups.length) groups = DEMO;
  const sig = JSON.stringify(groups);
  if (first){ S.sig = sig; S.start = performance.now(); build(groups, true); S.animEnd = S.city.maxT; schedule() }
  else if (sig !== S.sig){
    // 数据变化：直接重建。铺设动画还没播完时保留动画（各块的出现时间是确定的，不会跳回开头）
    S.sig = sig;
    build(groups, (performance.now() - S.start) / 1000 < S.animEnd);
  }
}

/* ---------------- 交互：拖动平移 / 滚轮缩放 / 双指缩放 ---------------- */
const ptrs = new Map(); let pinch = null, dragG = null;
canvas.addEventListener("pointerdown", e => {
  canvas.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, [e.clientX, e.clientY]);
  if (ptrs.size === 1){ dragG = ground(e.clientX, e.clientY); S.down = {x: e.clientX, y: e.clientY, moved: false} }
  if (ptrs.size === 2){ const [a, b] = [...ptrs.values()]; pinch = {d: Math.hypot(a[0] - b[0], a[1] - b[1]), m: [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2]}; dragG = null }
});
canvas.addEventListener("pointermove", e => {
  if (!ptrs.has(e.pointerId)){ hoverAt(e.clientX, e.clientY); return }
  ptrs.set(e.pointerId, [e.clientX, e.clientY]);
  if (S.down && !S.down.moved){
    if (ptrs.size === 1 && Math.hypot(e.clientX - S.down.x, e.clientY - S.down.y) <= 5) return;   // 小于 5px 不算拖动，留给点击
    S.down.moved = true; canvas.classList.add("drag"); hideTip(); S.tween = null;
  }
  if (ptrs.size === 2 && pinch){
    const [a, b] = [...ptrs.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]), m = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
    const g0 = ground(...pinch.m); zoomBy(d / pinch.d, m[0], m[1]); const g1 = ground(...m);
    cam.tx += g0[0] - g1[0]; cam.ty += g0[1] - g1[1]; pinch = {d, m};
  } else if (dragG){
    const g = ground(e.clientX, e.clientY); cam.tx += dragG[0] - g[0]; cam.ty += dragG[1] - g[1];
  }
  S.autoFit = false; S.camDirty = true;
});
const endPtr = e => {
  if (e.type === "pointerup" && ptrs.size === 1 && S.down && !S.down.moved) clickAt(e.clientX, e.clientY, e.pointerType === "touch");
  if (ptrs.size <= 1) S.down = null;
  ptrs.delete(e.pointerId); if (ptrs.size < 2) pinch = null; if (!ptrs.size){ dragG = null; canvas.classList.remove("drag") } else if (ptrs.size === 1){ const [p] = [...ptrs.values()]; dragG = ground(...p) } };
canvas.addEventListener("pointerup", endPtr); canvas.addEventListener("pointercancel", endPtr);
canvas.addEventListener("pointerleave", () => { if (!ptrs.size){ S.hover = null; hideTip(); canvas.classList.remove("pick") } });
function zoomBy(f, sx, sy){
  S.tween = null;
  const g0 = ground(sx, sy); cam.zoom = clamp(cam.zoom * f, 3, 80); updateVP(); const g1 = ground(sx, sy);
  cam.tx += g0[0] - g1[0]; cam.ty += g0[1] - g1[1]; S.autoFit = false; S.camDirty = true;
}
canvas.addEventListener("wheel", e => { e.preventDefault(); zoomBy(Math.exp(-e.deltaY * .0015), e.clientX, e.clientY) }, {passive: false});
$("zin").onclick = () => zoomBy(1.25, cssW / 2, cssH / 2);
$("zout").onclick = () => zoomBy(.8, cssW / 2, cssH / 2);
$("zfit").onclick = () => { S.autoFit = true; fit() };
$("replay").onclick = () => { const g = JSON.parse(S.sig); S.start = performance.now(); build(g, true); S.animEnd = S.city.maxT };
$("timebar").addEventListener("click", e => {
  const b = e.target.closest("button[data-h]"); if (!b) return;
  S.hourMode = b.dataset.h;
  for (const x of $("timebar").querySelectorAll("button")) x.classList.toggle("on", x === b);
});
addEventListener("resize", resize);
addEventListener("keydown", e => { if (e.key === "Escape") closeFloor() });
$("labels").addEventListener("click", e => {
  const el = e.target.closest(".fl.on"); if (!el) return;
  const bx = S.city.boxes.find(x => x.sel && x.b === +el.dataset.b && x.f === +el.dataset.f);
  if (bx) toggleFloor(bx);
});

/* ---------------- 楼层拾取：屏幕射线 × 每层包围盒（考虑当前抬升） ---------------- */
function pick(sx, sy){
  if (!S.city) return null;
  const nx = sx / cssW * 2 - 1, ny = 1 - sy / cssH * 2, hw = cssW / (2 * cam.zoom), hh = cssH / (2 * cam.zoom);
  const base = [cam.tx, cam.ty, 0], O = [0, 1, 2].map(i => base[i] + DV[i] * 300 + RV[i] * nx * hw + UV[i] * ny * hh), Dr = DV.map(v => -v);
  let best = null, bt = Infinity;
  for (const bx of S.city.boxes){
    const dz = liftOf(bx.b, bx.f), lo = [bx.x0, bx.y0, bx.z0 + dz], hi = [bx.x1, bx.y1, bx.z1 + dz];
    let t0 = -Infinity, t1 = Infinity;
    for (let i = 0; i < 3; i++){ const a = (lo[i] - O[i]) / Dr[i], c = (hi[i] - O[i]) / Dr[i]; t0 = Math.max(t0, Math.min(a, c)); t1 = Math.min(t1, Math.max(a, c)) }
    if (t1 >= t0 && t0 < bt){ bt = t0; best = bx }
  }
  return best && best.sel ? best : null;      // 最前面挡着的是大堂/楼顶时不算选中
}
const tip = $("tip");
function hideTip(){ tip.style.display = "none" }
function showTip(bx, sx, sy){
  const F = bx.F, ST = {working: "工作中", idle: "待命", done: "已结束", stopped: "已中止"}, SC = {working: "#2fbf71", idle: "#f2b630"};
  const open = S.selWant && S.selWant.b === bx.b && S.selWant.f === bx.f, on = F.work.filter(Boolean).length;
  const row = (k, v) => `<div class="row">${k}：<b>${h(v)}</b></div>`;
  tip.innerHTML = `<h4><i style="background:${SC[F.status] || "#b6bec9"}"></i>${bx.f}F · ${h(F.title)}</h4>`
    + row("设备", bx.label) + (F.src ? row("档位", F.src) : "") + row("主管", F.name || "—") + row("状态", ST[F.status] || F.status) + row("人数", F.vacant ? "—" : `主 agent 1 · 子 agent ${F.subs.length}（工作中 ${F.subs.filter(x => x === "working").length}）${F.subTotal > F.subs.length ? ` · 本任务累计 ${F.subTotal}` : ""}`)
    + `<div class="hint">${open ? "再次点击收起这一层" : "点击剖开这一层"}</div>`;
  tip.style.display = "block";
  const r = tip.getBoundingClientRect();
  let x = sx + 16, y = sy + 16;
  if (x + r.width > innerWidth - 8) x = sx - r.width - 16;
  if (y + r.height > innerHeight - 8) y = Math.max(8, sy - r.height - 16);
  tip.style.left = x + "px"; tip.style.top = y + "px";
}
function hoverAt(sx, sy){
  const p = pick(sx, sy);
  S.hover = p ? {b: p.b, f: p.f} : null;
  canvas.classList.toggle("pick", !!p);
  if (p) showTip(p, sx, sy); else hideTip();
}
function closeFloor(){ S.selWant = null }
function toggleFloor(bx){
  if (S.selWant && S.selWant.b === bx.b && S.selWant.f === bx.f){ closeFloor(); return }
  S.selWant = {b: bx.b, f: bx.f};
  // 镜头推近：把这一层放到画面中间略偏下（上方是抬起的楼层）
  const zoom = cam.zoom < 20 ? 22 : cam.zoom;
  const g = [bx.cx - DV[0] * bx.cz / DV[2], bx.cy - DV[1] * bx.cz / DV[2]];
  const v = [UV[0] - DV[0] * UV[2] / DV[2], UV[1] - DV[1] * UV[2] / DV[2]], k = .12 * cssH / zoom;
  S.tween = {a: {...cam}, b: {tx: g[0] + v[0] * k, ty: g[1] + v[1] * k, zoom}, t0: performance.now(), dur: 650};
  S.autoFit = false;
}
function clickAt(sx, sy, touch){
  const p = pick(sx, sy);
  if (p){ toggleFloor(p); showTip(p, sx, sy) } else { closeFloor(); hideTip() }
}

resize();
poll(true);
setInterval(() => poll(false), 3000);
</script>
